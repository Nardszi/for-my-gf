<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Our Diary — pages of us</title>
<meta name="theme-color" content="#1a0f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Our Diary — pages of us">
<meta property="og:description" content="A diary we both write in, one little page at a time. Made with all my love, Nard.">
<meta property="og:image" content="og-preview.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --rose: #ff8fab;
    --rose-deep: #e0567c;
    --cream: #fff7ee;
    --gold: #e8c17e;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #120a10;
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-fade {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(224,86,124,0.28), transparent 60%),
                radial-gradient(900px 500px at 100% 110%, rgba(232,193,126,0.12), transparent 55%),
                linear-gradient(180deg, #1a0f14, #120a10);
  }
  .page { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; padding: 0 1.2rem 3.5rem; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; }
  .topbar a { color: var(--cream); text-decoration: none; font-size: 0.82rem; letter-spacing: 0.06em; border: 1px solid rgba(255,143,171,0.35); padding: 0.45rem 0.9rem; border-radius: 999px; transition: background 0.3s ease; }
  .topbar a:hover { background: rgba(224,86,124,0.25); }
  .topbar .brand { font-family: Georgia, serif; letter-spacing: 0.14em; color: var(--gold); font-size: 0.95rem; }

  header { text-align: center; padding: 1.4rem 0 1rem; }
  header h1 {
    font-family: Georgia, serif; font-weight: 500;
    font-size: clamp(2rem, 8vw, 3rem);
    background: linear-gradient(90deg, #ffd3e0, var(--gold), #fff, var(--gold), #ffd3e0);
    background-size: 250% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 5s linear infinite;
  }
  header p { font-size: 0.86rem; font-style: italic; color: rgba(255,247,238,0.62); margin-top: 0.4rem; }
  .counter { display: inline-block; margin-top: 0.7rem; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--rose); border: 1px solid rgba(255,143,171,0.4); padding: 0.4rem 1rem; border-radius: 999px; }

  .composer {
    margin-top: 1.5rem;
    background: rgba(30,17,24,0.7);
    border: 1px solid rgba(255,143,171,0.3);
    border-radius: 18px;
    padding: 1.2rem;
    backdrop-filter: blur(6px);
  }
  .composer .row { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; }
  .composer input[type="date"] {
    flex: 1; background: rgba(18,10,16,0.8); border: 1px solid rgba(255,143,171,0.3);
    color: var(--cream); font-family: inherit; font-size: 0.85rem;
    padding: 0.6rem 0.7rem; border-radius: 12px;
  }
  .author-pick { display: flex; gap: 0.4rem; }
  .author-pick button {
    border: 1px solid rgba(255,143,171,0.35); background: rgba(18,10,16,0.8);
    color: rgba(255,247,238,0.7); font-family: inherit; font-size: 0.8rem;
    padding: 0.5rem 0.8rem; border-radius: 12px; cursor: pointer;
    transition: all 0.25s ease;
  }
  .author-pick button.active { background: linear-gradient(135deg, var(--rose), var(--rose-deep)); color: #fff; border-color: transparent; }
  .composer textarea {
    width: 100%; min-height: 96px; resize: vertical;
    background: rgba(18,10,16,0.8); border: 1px solid rgba(255,143,171,0.3);
    color: var(--cream); font-family: inherit; font-size: 0.92rem; line-height: 1.6;
    padding: 0.8rem; border-radius: 12px; outline: none;
  }
  .composer textarea::placeholder { color: rgba(255,247,238,0.35); }
  .composer textarea:focus { border-color: var(--rose); }
  .composer .add {
    width: 100%; margin-top: 0.8rem;
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    border: none; color: #fff; font-family: inherit;
    font-size: 0.88rem; letter-spacing: 0.05em;
    padding: 0.8rem; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(224,86,124,0.35);
    transition: transform 0.15s var(--spring);
  }
  .composer .add:active { transform: scale(0.97); }

  .entries-title {
    margin: 2rem 0 0.8rem;
    font-size: 0.72rem; letter-spacing: 0.26em; text-transform: uppercase;
    color: rgba(255,247,238,0.55);
  }
  .entry {
    position: relative;
    background: rgba(30,17,24,0.65);
    border: 1px solid rgba(255,143,171,0.22);
    border-radius: 16px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.8rem;
    animation: fadeUp 0.5s var(--spring);
  }
  .entry .head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
  .entry .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 700; color: #fff;
  }
  .entry .avatar.her { background: linear-gradient(135deg, var(--rose), var(--rose-deep)); }
  .entry .avatar.him { background: linear-gradient(135deg, var(--gold), #c89b5a); }
  .entry .who { font-size: 0.85rem; font-weight: 600; }
  .entry .when { font-size: 0.72rem; color: rgba(255,247,238,0.5); }
  .entry .text { font-size: 0.92rem; line-height: 1.7; color: rgba(255,247,238,0.9); white-space: pre-wrap; word-break: break-word; }
  .entry .del {
    position: absolute; top: 0.7rem; right: 0.8rem;
    background: none; border: none; color: rgba(255,247,238,0.35);
    font-size: 1rem; cursor: pointer; padding: 0.2rem;
    transition: color 0.2s ease;
  }
  .entry .del:hover { color: var(--rose-deep); }

  .empty { text-align: center; padding: 3rem 1rem; color: rgba(255,247,238,0.4); }
  .empty .big { font-size: 2rem; margin-bottom: 0.6rem; }
  .empty p { font-size: 0.86rem; font-style: italic; }

  .footer-note { text-align: center; margin-top: 2rem; font-size: 0.78rem; font-style: italic; color: rgba(255,247,238,0.45); }

  @keyframes shimmer { to { background-position: 250% center; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="bg-fade" aria-hidden="true"></div>

<div class="page">
  <div class="topbar">
    <span class="brand">OUR DIARY</span>
    <a href="lovepage.html">&#8592; back</a>
  </div>

  <header>
    <h1>Pages of Us</h1>
    <p>a diary we both write in &mdash; our little forever notebook</p>
    <div class="counter" id="entryCounter">0 pages so far</div>
  </header>

  <div class="composer">
    <div class="row">
      <input type="date" id="entryDate">
      <div class="author-pick">
        <button data-author="Rezil" class="active" id="pickRezil">Rezil</button>
        <button data-author="Nard" id="pickNard">Nard</button>
      </div>
    </div>
    <textarea id="entryText" placeholder="what happened today, my love?"></textarea>
    <button class="add" id="addEntry">&#10084; add this page</button>
  </div>

  <p class="entries-title">our entries</p>
  <div id="entryList"></div>

  <p class="footer-note">every page here is a little forever we wrote together</p>
</div>

<script>
  var STORE_KEY = 'forMyGf_diary';
  var author = 'Rezil';
  var entries = [];
  try { entries = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch (e) { entries = []; }

  var entryDate = document.getElementById('entryDate');
  var entryText = document.getElementById('entryText');
  var entryList = document.getElementById('entryList');
  var entryCounter = document.getElementById('entryCounter');

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  entryDate.value = todayISO();
  entryDate.max = todayISO();

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); } catch (e) {}
  }

  function fmtDate(iso) {
    try {
      var d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    } catch (e) { return iso; }
  }

  function render() {
    entryCounter.textContent = entries.length + (entries.length === 1 ? ' page' : ' pages') + ' so far';
    if (!entries.length) {
      entryList.innerHTML = '<div class="empty"><div class="big">&#128213;</div><p>the first page is waiting for you...</p></div>';
      return;
    }
    var html = '';
    entries.forEach(function(en, i) {
      var isHer = en.author === 'Rezil';
      html += '<div class="entry" style="animation-delay:' + (i * 0.04) + 's">' +
        '<button class="del" data-i="' + i + '" aria-label="delete entry">&times;</button>' +
        '<div class="head">' +
          '<span class="avatar ' + (isHer ? 'her' : 'him') + '">' + (isHer ? 'R' : 'N') + '</span>' +
          '<div><div class="who">' + en.author + '</div><div class="when">' + fmtDate(en.date) + '</div></div>' +
        '</div>' +
        '<div class="text"></div>' +
      '</div>';
    });
    entryList.innerHTML = html;
    entries.forEach(function(en, i) {
      var textEl = entryList.querySelectorAll('.entry .text')[i];
      textEl.textContent = en.text;
    });
  }

  function addEntry() {
    var text = entryText.value.trim();
    if (!text) {
      entryText.focus();
      return;
    }
    entries.unshift({ date: entryDate.value || todayISO(), author: author, text: text, at: Date.now() });
    save();
    entryText.value = '';
    render();
    if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }
  }

  document.getElementById('addEntry').addEventListener('click', addEntry);
  entryText.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') addEntry();
  });

  document.querySelectorAll('.author-pick button').forEach(function(b) {
    b.addEventListener('click', function() {
      author = b.getAttribute('data-author');
      document.querySelectorAll('.author-pick button').forEach(function(x) { x.classList.remove('active'); });
      b.classList.add('active');
    });
  });

  entryList.addEventListener('click', function(e) {
    var del = e.target.closest('.del');
    if (!del) return;
    var i = Number(del.getAttribute('data-i'));
    entries.splice(i, 1);
    save();
    render();
  });

  render();

  window.scrollTo(0, 0);
  window.addEventListener('pageshow', function() { window.scrollTo(0, 0); });
</script>
<script src="app.js"></script>
</body>
</html>
