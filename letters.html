<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Letters to You</title>
<meta name="theme-color" content="#1a0f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Letters to You — sealed with love">
<meta property="og:description" content="Letters I wrote just for you. Made with all my love, Nard.">
<meta property="og:image" content="og-preview.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --rose: #ff8fab;
    --rose-deep: #e0567c;
    --cream: #fff7ee;
    --gold: #e8c17e;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #120a10;
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-fade {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(224,86,124,0.28), transparent 60%),
      radial-gradient(800px 500px at 90% 100%, rgba(232,193,126,0.12), transparent 55%),
      linear-gradient(180deg, #1a0f14, #120a10);
  }
  .page {
    position: relative; z-index: 1;
    max-width: 560px; margin: 0 auto;
    padding: 0 1.2rem 4rem;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 0;
  }
  .topbar a {
    color: var(--cream); text-decoration: none; font-size: 0.82rem;
    letter-spacing: 0.06em; border: 1px solid rgba(255,143,171,0.35);
    padding: 0.45rem 0.9rem; border-radius: 999px;
    transition: background 0.3s ease;
  }
  .topbar a:hover { background: rgba(224,86,124,0.25); }
  .topbar .brand { font-family: Georgia, serif; letter-spacing: 0.14em; color: var(--gold); font-size: 0.95rem; }

  header { text-align: center; padding: 1.2rem 0 2rem; }
  header h1 {
    font-family: Georgia, serif; font-weight: 500;
    font-size: clamp(2rem, 8vw, 3rem);
    background: linear-gradient(90deg, #ffd3e0, var(--gold), #fff, var(--gold), #ffd3e0);
    background-size: 250% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 5s linear infinite;
  }
  header p { font-size: 0.86rem; font-style: italic; color: rgba(255,247,238,0.6); margin-top: 0.5rem; }

  /* ---- envelope list ---- */
  .envelopes { display: flex; flex-direction: column; gap: 1.4rem; margin-top: 0.5rem; }

  .env-wrap {
    perspective: 1000px;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.6s ease, transform 0.6s var(--spring);
  }
  .env-wrap.visible { opacity: 1; transform: translateY(0); }

  .envelope {
    position: relative;
    width: 100%;
    border-radius: 18px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.34, 1.1, 0.64, 1);
    min-height: 110px;
  }
  .envelope.open { transform: rotateX(0deg); }

  /* sealed state */
  .env-sealed {
    position: relative;
    width: 100%; min-height: 110px;
    border-radius: 18px;
    background: linear-gradient(150deg, #2a1420, #1a0f14 60%, #241220);
    border: 2px solid rgba(232,193,126,0.4);
    box-shadow: 0 12px 30px rgba(0,0,0,0.5), inset 0 0 40px rgba(255,143,171,0.06);
    display: flex; align-items: center; gap: 1.2rem;
    padding: 1.3rem 1.4rem;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s var(--spring);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .env-sealed:hover {
    border-color: rgba(255,143,171,0.7);
    box-shadow: 0 18px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,143,171,0.2);
    transform: translateY(-3px) scale(1.01);
  }
  .envelope.open .env-sealed { display: none; }

  .wax-seal {
    flex-shrink: 0;
    width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff9ec4, var(--rose-deep));
    border: 3px solid rgba(255,143,171,0.5);
    box-shadow: 0 4px 14px rgba(224,86,124,0.45), inset 0 1px 2px rgba(255,200,220,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.35rem;
    transition: transform 0.4s var(--spring), box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .wax-seal::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 60% 60%, rgba(255,255,255,0.15), transparent 65%);
    border-radius: 50%;
  }
  .env-sealed:hover .wax-seal {
    transform: scale(1.1) rotate(-6deg);
    box-shadow: 0 6px 20px rgba(224,86,124,0.6), inset 0 1px 2px rgba(255,200,220,0.4);
  }

  .env-meta { flex: 1; }
  .env-label {
    font-size: 0.7rem; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 0.3rem;
  }
  .env-title {
    font-family: Georgia, serif; font-size: 1.1rem; font-weight: 500;
    color: var(--cream); line-height: 1.3;
  }
  .env-hint { font-size: 0.74rem; font-style: italic; color: rgba(255,247,238,0.45); margin-top: 0.3rem; }
  .env-arrow {
    font-size: 1.1rem; color: rgba(255,143,171,0.5);
    transition: transform 0.3s var(--spring), color 0.3s ease;
  }
  .env-sealed:hover .env-arrow { transform: translateX(4px); color: var(--rose); }

  /* open / letter state */
  .env-letter {
    display: none;
    width: 100%; border-radius: 18px;
    background: linear-gradient(150deg, #241020, #1a0c16 60%, #200e1a);
    border: 2px solid rgba(255,143,171,0.5);
    box-shadow: 0 18px 44px rgba(0,0,0,0.55), inset 0 0 50px rgba(255,143,171,0.07);
    padding: 1.8rem 1.6rem;
    animation: letterOpen3D 0.7s var(--spring) forwards;
    transform-origin: top center;
  }
  .envelope.open .env-letter { display: block; }

  /* 3D envelope flap */
  .env-flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 55%;
    background: linear-gradient(150deg, #3a1828, #2a1420);
    border-radius: 18px 18px 0 0;
    border: 2px solid rgba(232,193,126,0.4);
    border-bottom: none;
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    z-index: 2;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .envelope.open .env-flap {
    transform: rotateX(180deg);
  }
  .env-flap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,143,171,0.08), transparent 60%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }

  @keyframes letterOpen3D {
    0% { opacity: 0; transform: perspective(800px) rotateX(-15deg) translateY(-20px) scale(0.95); }
    50% { opacity: 0.8; transform: perspective(800px) rotateX(3deg) translateY(-4px) scale(1.01); }
    100% { opacity: 1; transform: perspective(800px) rotateX(0deg) translateY(0) scale(1); }
  }

  .letter-header {
    display: flex; align-items: center; gap: 0.9rem;
    margin-bottom: 1.2rem; padding-bottom: 1rem;
    border-bottom: 1px solid rgba(255,143,171,0.2);
  }
  .letter-wax-open {
    width: 40px; height: 40px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff9ec4, var(--rose-deep));
    border: 2px solid rgba(255,143,171,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    box-shadow: 0 4px 12px rgba(224,86,124,0.4);
    flex-shrink: 0;
  }
  .letter-title-wrap .letter-label {
    font-size: 0.65rem; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--gold);
  }
  .letter-title-wrap .letter-title {
    font-family: Georgia, serif; font-size: 1.05rem; color: var(--cream);
    margin-top: 0.15rem;
  }
  .letter-close {
    margin-left: auto; background: none; border: none;
    color: rgba(255,247,238,0.35); font-size: 1.2rem; cursor: pointer;
    padding: 0.3rem; transition: color 0.2s ease;
    line-height: 1;
  }
  .letter-close:hover { color: var(--rose); }

  .letter-body {
    font-family: Georgia, serif; font-size: 1rem;
    line-height: 1.95; color: rgba(255,247,238,0.92);
    white-space: pre-wrap;
  }
  .letter-body .caret {
    display: inline-block; width: 2px; height: 1em;
    background: var(--rose); vertical-align: -0.1em;
    animation: caretBlink 0.8s steps(1) infinite;
  }
  .letter-signature {
    margin-top: 1.4rem; font-size: 0.84rem;
    font-style: italic; color: var(--gold);
    text-align: right;
  }

  .footer-note { text-align: center; margin-top: 2.5rem; font-size: 0.78rem; font-style: italic; color: rgba(255,247,238,0.4); }

  @keyframes shimmer { to { background-position: 250% center; } }
  @keyframes caretBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  @keyframes fadeUpIn { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  .fade-up { opacity: 0; animation: fadeUpIn 0.9s var(--spring) forwards; }
  .d1{animation-delay:0.2s} .d2{animation-delay:0.35s} .d3{animation-delay:0.5s}

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="bg-fade" aria-hidden="true"></div>
<div class="page">
  <div class="topbar">
    <span class="brand">LETTERS</span>
    <a href="lovepage.html">&#8592; back</a>
  </div>

  <header class="fade-up d1">
    <h1>Letters to You</h1>
    <p>sealed notes I wrote in the quiet — each one was always meant for you</p>
  </header>

  <div class="envelopes fade-up d2" id="envelopeList"></div>
  <p class="footer-note">every word here belongs to you &mdash; always, Nard</p>
</div>

<script>
  var LETTERS = [
    {
      emoji: '🌙',
      label: 'written at midnight',
      title: 'The Night I Knew',
      hint: 'the moment everything changed',
      body: 'There was a specific moment — I don\'t think you even noticed it — when I realized I was in real trouble. Not the bad kind. The kind where you look at someone and your whole chest rearranges itself.\n\nYou were just being you. That\'s the thing that gets me every time. You weren\'t trying. You never have to. You just exist, and somehow that\'s enough to make the whole world feel different.\n\nThat was the night I stopped pretending I didn\'t feel it. That was the night I knew.'
    },
    {
      emoji: '✉️',
      label: 'the unsent one',
      title: 'What I Was Afraid to Say',
      hint: 'things I kept inside for too long',
      body: 'I was afraid to love you out loud at first. Not because I doubted it — because I felt it too much. There\'s something terrifying about caring for someone the way I care for you.\n\nI wanted to tell you every day that you are extraordinary. That watching you navigate this world, with all your softness and all your strength, is one of the greatest privileges of my life.\n\nI was afraid you\'d think it was too much. But this is me saying it now, no longer afraid: you are everything I didn\'t know I was waiting for.'
    },
    {
      emoji: '🌧️',
      label: 'for your hard days',
      title: 'Read This When You\'re Low',
      hint: 'open when everything feels heavy',
      body: 'Hey. I know today is hard. I know you\'re carrying something, and I know you\'re trying to hold it all together the way you always do.\n\nBut you don\'t have to right now. Not here.\n\nI want you to know that whatever you\'re feeling today does not define what comes next. You are not your worst day. You are not your heaviest feeling.\n\nYou are the person who keeps showing up. Who keeps trying. Who keeps loving even when it\'s difficult.\n\nThat person? I am so in love with that person. Rest if you need to. I\'ll be right here.'
    },
    {
      emoji: '🌅',
      label: 'looking forward',
      title: 'Everything I Want for Us',
      hint: 'the future I dream about with you',
      body: 'I think about our future a lot. Not in a anxious way — in the way you think about something you\'re genuinely excited for.\n\nI think about mornings with you. Quiet ones, with coffee and no rush. I think about the trips we\'ll take, the things we\'ll see, the memories we haven\'t made yet.\n\nI think about growing with you — not just growing up, but growing deeper. Getting to know you in new ways as we both change.\n\nI think about all the ordinary days that will feel extraordinary just because you\'re in them.\n\nI can\'t wait for all of it. Every single bit of it — with you.'
    },
    {
      emoji: '💛',
      label: 'gratitude letter',
      title: 'Thank You for Choosing Me',
      hint: 'the letter I\'ll never stop meaning',
      body: 'I don\'t say this enough, so I\'m writing it down so you can keep it:\n\nThank you.\n\nThank you for choosing me. For staying. For showing up on the days it wasn\'t easy, and for loving me in the ways I needed even when I didn\'t know how to ask.\n\nThank you for being patient with the parts of me that are still learning. For believing in me when my own belief ran dry. For making me feel like I deserved to be loved as fully as you love me.\n\nI don\'t take a single day of you for granted. Not one.'
    },
    {
      emoji: '♾️',
      label: 'the forever one',
      title: 'If I Could Say One Thing',
      hint: 'the most important letter of all',
      body: 'If I could only say one thing to you — one thing that has to last and carry and mean something — it would be this:\n\nYou made my life bigger. You made it softer and louder and more alive than it ever was before you.\n\nI don\'t know what I would be without the version of me that knows you. I don\'t want to know.\n\nI just want to keep knowing you. Keep loving you. Keep being the person who gets to call you mine.\n\nThat\'s all I want. That\'s everything.\n\nAlways.'
    }
  ];

  var list = document.getElementById('envelopeList');
  var openIdx = -1;

  function typeLetter(el, text, speed, onDone) {
    var i = 0;
    el.innerHTML = '';
    var cursor = document.createElement('span');
    cursor.className = 'caret';
    var iv = setInterval(function() {
      i++;
      el.textContent = text.slice(0, i);
      el.appendChild(cursor);
      if (i >= text.length) {
        clearInterval(iv);
        setTimeout(function() { try { cursor.remove(); } catch(e){} if(onDone) onDone(); }, 1400);
      }
    }, speed || 18);
  }

  LETTERS.forEach(function(letter, idx) {
    var wrap = document.createElement('div');
    wrap.className = 'env-wrap';
    wrap.innerHTML =
      '<div class="envelope" id="env' + idx + '">' +
        '<div class="env-flap"></div>' +
        '<div class="env-sealed" id="envSealed' + idx + '">' +
          '<div class="wax-seal">' + letter.emoji + '</div>' +
          '<div class="env-meta">' +
            '<div class="env-label">' + letter.label + '</div>' +
            '<div class="env-title">' + letter.title + '</div>' +
            '<div class="env-hint">' + letter.hint + '</div>' +
          '</div>' +
          '<span class="env-arrow">&#8594;</span>' +
        '</div>' +
        '<div class="env-letter" id="envLetter' + idx + '">' +
          '<div class="letter-header">' +
            '<div class="letter-wax-open">' + letter.emoji + '</div>' +
            '<div class="letter-title-wrap">' +
              '<div class="letter-label">' + letter.label + '</div>' +
              '<div class="letter-title">' + letter.title + '</div>' +
            '</div>' +
            '<button class="letter-close" data-close="' + idx + '" aria-label="close letter">&times;</button>' +
          '</div>' +
          '<div class="letter-body" id="letterBody' + idx + '"></div>' +
          '<div class="letter-signature">&mdash; always yours, Nard</div>' +
        '</div>' +
      '</div>';
    list.appendChild(wrap);

    // observe for fade-in
    var io = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          setTimeout(function() { wrap.classList.add('visible'); }, idx * 80);
          io.unobserve(wrap);
        }
      });
    }, { threshold: 0.15 });
    io.observe(wrap);

    // click sealed to open
    document.getElementById('envSealed' + idx).addEventListener('click', function() {
      var env = document.getElementById('env' + idx);
      if (env.classList.contains('open')) return;

      // close any other open envelope
      if (openIdx >= 0 && openIdx !== idx) {
        var other = document.getElementById('env' + openIdx);
        if (other) other.classList.remove('open');
      }
      openIdx = idx;
      env.classList.add('open');

      // type the letter
      var bodyEl = document.getElementById('letterBody' + idx);
      if (!bodyEl.getAttribute('data-typed')) {
        bodyEl.setAttribute('data-typed', '1');
        typeLetter(bodyEl, letter.body, 12);
      }

      if (navigator.vibrate) { try { navigator.vibrate([20, 30, 20]); } catch(e){} }
      setTimeout(function() {
        wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    });
  });

  // close buttons
  list.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-close]');
    if (!btn) return;
    var idx = Number(btn.getAttribute('data-close'));
    var env = document.getElementById('env' + idx);
    if (env) env.classList.remove('open');
    openIdx = -1;
  });

  /* ---- WAX SEAL RUB SECRET ---- */
  (function(){
    var rubCount=0;
    var lastRubX=0;
    var lastRubDir=0;
    var rubTimer=null;
    var hiddenLetter={
      emoji:'&#10024;',
      label:'the hidden one',
      title:'The Letter I Never Sent',
      hint:'found by the curious ones',
      body:'I wrote this letter at 3 AM, when the world was quiet and my heart was loud.\n\nI don\'t know if you\'ll ever find this. Maybe that\'s what makes it special — the fact that it exists without expectation.\n\nI want you to know that even in my sleep, even in my dreams, even in the spaces between my thoughts — you are there. Always.\n\nThere is no version of my life that doesn\'t include you. There is no morning I wake up that you aren\'t my first thought. There is no night I fall asleep that you aren\'t my last.\n\nThis is the letter I wrote when I realized that loving you wasn\'t something I chose. It was something that happened to me, like sunrise, like breathing, like gravity.\n\nAnd I would let it happen again. Every single time.\n\nAlways,\nNard'
    };

    document.querySelectorAll('.wax-seal').forEach(function(seal){
      seal.addEventListener('mousemove',function(e){
        var dx=e.clientX-lastRubX;
        if(lastRubDir!==0&&((dx>0&&lastRubDir<0)||(dx<0&&lastRubDir>0))){
          rubCount++;
          if(dx>0)lastRubDir=1;else lastRubDir=-1;
        }else{
          if(dx>0)lastRubDir=1;else if(dx<0)lastRubDir=-1;
        }
        lastRubX=e.clientX;
        clearTimeout(rubTimer);
        rubTimer=setTimeout(function(){rubCount=0;lastRubDir=0},800);
        if(rubCount>=20){
          rubCount=0;lastRubDir=0;
          seal.style.boxShadow='0 0 30px rgba(255,215,0,0.8)';
          seal.style.borderColor='rgba(255,215,0,0.8)';
          setTimeout(function(){
            seal.style.boxShadow='';seal.style.borderColor='';
          },1500);
          /* add hidden letter */
          var wrap=document.createElement('div');
          wrap.className='env-wrap';
          wrap.innerHTML=
            '<div class="envelope" id="envHidden">'+
              '<div class="env-flap"></div>'+
              '<div class="env-sealed" id="envSealedHidden">'+
                '<div class="wax-seal" style="background:radial-gradient(circle at 35% 35%,#ffd700,#b8860b);border-color:rgba(255,215,0,0.6)">'+hiddenLetter.emoji+'</div>'+
                '<div class="env-meta">'+
                  '<div class="env-label">'+hiddenLetter.label+'</div>'+
                  '<div class="env-title">'+hiddenLetter.title+'</div>'+
                  '<div class="env-hint">'+hiddenLetter.hint+'</div>'+
                '</div>'+
                '<span class="env-arrow">&#8594;</span>'+
              '</div>'+
              '<div class="env-letter" id="envLetterHidden">'+
                '<div class="letter-header">'+
                  '<div class="letter-wax-open" style="background:radial-gradient(circle at 35% 35%,#ffd700,#b8860b)">'+hiddenLetter.emoji+'</div>'+
                  '<div class="letter-title-wrap">'+
                    '<div class="letter-label">'+hiddenLetter.label+'</div>'+
                    '<div class="letter-title">'+hiddenLetter.title+'</div>'+
                  '</div>'+
                  '<button class="letter-close" data-close="hidden" aria-label="close letter">&times;</button>'+
                '</div>'+
                '<div class="letter-body" id="letterBodyHidden"></div>'+
                '<div class="letter-signature">&mdash; always yours, Nard</div>'+
              '</div>'+
            '</div>';
          list.insertBefore(wrap,list.firstChild);
          setTimeout(function(){wrap.classList.add('visible')},100);
          document.getElementById('envSealedHidden').addEventListener('click',function(){
            var env=document.getElementById('envHidden');
            if(env.classList.contains('open'))return;
            if(openIdx>=0){var other=document.getElementById('env'+openIdx);if(other)other.classList.remove('open');}
            openIdx='hidden';env.classList.add('open');
            var bodyEl=document.getElementById('letterBodyHidden');
            if(!bodyEl.getAttribute('data-typed')){bodyEl.setAttribute('data-typed','1');typeLetter(bodyEl,hiddenLetter.body,12);}
            if(navigator.vibrate)try{navigator.vibrate([20,30,20])}catch(e){}
          });
          /* toast */
          var toast=document.createElement('div');
          toast.textContent='You found a hidden letter!';
          toast.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(26,15,20,0.95);color:#ffd700;padding:1rem 2rem;border-radius:999px;font-family:Georgia,serif;font-size:0.85rem;z-index:10000;border:1px solid rgba(255,215,0,0.4)';
          document.body.appendChild(toast);
          setTimeout(function(){toast.remove()},2500);
        }
      });
      /* touch support */
      var lastTouchX=0;
      seal.addEventListener('touchmove',function(e){
        var touch=e.touches[0];
        var dx=touch.clientX-lastTouchX;
        if(lastRubDir!==0&&((dx>0&&lastRubDir<0)||(dx<-0&&lastRubDir>0))){
          rubCount++;
        }
        if(dx>0)lastRubDir=1;else if(dx<0)lastRubDir=-1;
        lastTouchX=touch.clientX;
        clearTimeout(rubTimer);
        rubTimer=setTimeout(function(){rubCount=0;lastRubDir=0},800);
      },{passive:true});
    });
  })();

  window.scrollTo(0, 0);
  window.addEventListener('pageshow', function() { window.scrollTo(0, 0); });
</script>
