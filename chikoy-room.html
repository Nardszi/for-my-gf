<body>
<canvas id="roomCanvas"></canvas>
<div class="topbar">

</div>
<div class="hint" id="hint">tap lamp · tap window · tap chikoy · tap letter · tap photo · tap typewriter · tap candle · swipe down</div>
<script>
(function(){
"use strict";
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==="number")r=[r,r,r,r];
    this.moveTo(x+r[0],y);this.lineTo(x+w-r[1],y);this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]);this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h);this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]);this.quadraticCurveTo(x,y,x+r[0],y);this.closePath();return this;
  };
}
var canvas=document.getElementById("roomCanvas"),rc=canvas.getContext("2d");
var dpr=Math.min(window.devicePixelRatio||1,2);
var W,H;
var time=0,lastTime=0,dt=0;
var CW=360,CH=500;

var photos=[];
for(var i=0;i<5;i++){photos[i]=new Image();photos[i].src="float-photos/"+(i+1)+".jpg";}

var polaroidPhotos=[];
for(var i=0;i<5;i++){
  polaroidPhotos.push(new Image());
  polaroidPhotos[i].src="float-photos/"+(i+1)+".jpg";
}
var floatingPolaroids=[];
function initFloatingPolaroids(){
  floatingPolaroids=[];
  for(var i=0;i<5;i++){
    floatingPolaroids.push({
      angle:i*Math.PI*2/5,
      orbitR:55+Math.random()*15,
      speed:0.0003+Math.random()*0.0002,
      bobPhase:Math.random()*Math.PI*2,
      bobSpeed:0.0008+Math.random()*0.0004,
      bobAmp:6+Math.random()*4,
      tiltPhase:Math.random()*Math.PI*2,
      tiltAmp:0.15+Math.random()*0.1,
      baseX:170,
      baseY:160,
      photoIdx:i,
      size:28+Math.random()*6
    });
  }
}
initFloatingPolaroids();
var polaroidHoverIdx=-1;

var loveMessages=[
"You make every day worth waking up for",
"I fall in love with you more each day",
"Your smile is my favorite notification",
"Home is wherever you are",
"You are my today and all of my tomorrows",
"I love you more than words can say",
"You are the reason I believe in love",
"Every moment with you is a treasure",
"You make my heart smile",
"I choose you, today and always",
"You are my sunshine on a cloudy day",
"My favorite place is next to you",
"You are my happy place",
"I love you to the moon and back",
"You are my dream come true",
"You are my soulmate",
"Forever isn't long enough with you",
"You are my everything",
"With you, I am home",
"You are my forever and always"
];

function getDayPhase(){
  var h=new Date().getHours()+new Date().getMinutes()/60;
  if(h>=6&&h<7)return{brightness:(h-6),isDay:true};
  if(h>=7&&h<17)return{brightness:1,isDay:true};
  if(h>=17&&h<18)return{brightness:1-(h-17),isDay:true};
  return{brightness:0,isDay:false};
}

var room={lampBright:true,chikoyWave:false,waveTimer:0,shootStar:null,dust:[],touchStartY:0,touchStartX:0,hintShown:true,letterOpen:false,letterZoom:0,photoIdx:0,photoFade:1,photoTimer:0,photoZoom:false,photoZoomScale:0,typewriter:{lines:[],charIdx:0,msgIdx:0,typing:false,lastType:0,paperOffset:0,currentMsg:"",lastAutoType:0},raining:false,rainDrops:[],candleOn:true,floatingNotes:[]};

var initPhase=getDayPhase();
room.lampBright=!initPhase.isDay;
room.candleOn=!initPhase.isDay;
room.typewriter.lastAutoType=0;

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  initDust();
}
function initDust(){
  room.dust=[];
  for(var i=0;i<25;i++){
    room.dust.push({x:40+Math.random()*140,y:130+Math.random()*250,vx:(Math.random()-.5)*0.1,vy:-0.03-Math.random()*0.06,sz:0.6+Math.random()*1.4,a:0.1+Math.random()*0.25,ph:Math.random()*Math.PI*2});
  }
}
resize();
window.addEventListener("resize",resize);
function screenToRoom(sx,sy){
  var scale=Math.min(W/CW,H/CH);
  var ox=(W-CW*scale)/2,oy=(H-CH*scale)/2;
  return{x:(sx-ox)/scale,y:(sy-oy)/scale};
}
function fadeHint(){if(!room.hintShown)return;room.hintShown=false;var h=document.getElementById("hint");h.style.transition="opacity 1.2s";h.style.opacity="0";}

canvas.addEventListener("touchstart",function(e){room.touchStartY=e.touches[0].clientY;room.touchStartX=e.touches[0].clientX;},{passive:true});
canvas.addEventListener("touchend",function(e){
  fadeHint();
  if(e.changedTouches.length===0)return;
  var touch=e.changedTouches[0];
  var dy=touch.clientY-room.touchStartY;
  if(room.photoZoom){room.photoZoom=false;if(navigator.vibrate)navigator.vibrate(10);return;}
  if(room.letterOpen){room.letterOpen=false;if(navigator.vibrate)navigator.vibrate(10);return;}
  if(dy>60){history.back();return;}
  var p=screenToRoom(touch.clientX,touch.clientY);
  if(p.x>=248&&p.x<=312&&p.y>=2&&p.y<=50){room.photoZoom=true;room.photoZoomScale=0;if(navigator.vibrate)navigator.vibrate(15);return;}
  if(p.x>=210&&p.x<=262&&p.y>=258&&p.y<=294){
    var tw=room.typewriter;
    if(!tw.typing){tw.typing=true;tw.charIdx=0;tw.currentMsg=loveMessages[Math.floor(Math.random()*loveMessages.length)];tw.lastType=time;}
    if(navigator.vibrate)navigator.vibrate(15);return;
  }
  if(p.x>=60&&p.x<=110&&p.y>=210&&p.y<=280){room.lampBright=!room.lampBright;if(navigator.vibrate)navigator.vibrate(15);return;}
  if(p.x>=20&&p.x<=120&&p.y>=55&&p.y<=200){var phase=getDayPhase();if(!phase.isDay){room.raining=!room.raining;}room.shootStar={x:35+Math.random()*50,y:70,vx:2+Math.random()*2,vy:1+Math.random()*1.5,life:1};if(navigator.vibrate)navigator.vibrate(15);return;}
  if(Math.abs(p.x-170)<35&&Math.abs(p.y-240)<45){room.chikoyWave=true;room.waveTimer=0;if(navigator.vibrate)navigator.vibrate([10,30,10]);return;}
  if(p.x>=125&&p.x<=205&&p.y>=278&&p.y<=310){room.letterOpen=true;room.letterZoom=0;if(navigator.vibrate)navigator.vibrate(20);}
  if(p.x>=240&&p.x<=256&&p.y>=270&&p.y<=296){room.candleOn=!room.candleOn;if(navigator.vibrate)navigator.vibrate(15);}
});
canvas.addEventListener("click",function(e){
  fadeHint();
  var p=screenToRoom(e.clientX,e.clientY);
  if(room.photoZoom){room.photoZoom=false;return;}
  if(room.letterOpen){room.letterOpen=false;return;}
  if(p.x>=248&&p.x<=312&&p.y>=2&&p.y<=50){room.photoZoom=true;room.photoZoomScale=0;return;}
  if(p.x>=210&&p.x<=262&&p.y>=258&&p.y<=294){
    var tw=room.typewriter;
    if(!tw.typing){tw.typing=true;tw.charIdx=0;tw.currentMsg=loveMessages[Math.floor(Math.random()*loveMessages.length)];tw.lastType=time;}
    return;
  }
  if(p.x>=60&&p.x<=110&&p.y>=210&&p.y<=280){room.lampBright=!room.lampBright;return;}
  if(p.x>=20&&p.x<=120&&p.y>=55&&p.y<=200){var phase=getDayPhase();if(!phase.isDay){room.raining=!room.raining;}room.shootStar={x:35+Math.random()*50,y:70,vx:2+Math.random()*2,vy:1+Math.random()*1.5,life:1};return;}
  if(Math.abs(p.x-170)<35&&Math.abs(p.y-240)<45){room.chikoyWave=true;room.waveTimer=0;return;}
  if(p.x>=125&&p.x<=205&&p.y>=278&&p.y<=310){room.letterOpen=true;room.letterZoom=0;}
  if(p.x>=240&&p.x<=256&&p.y>=270&&p.y<=296){room.candleOn=!room.candleOn;}
});
function noise(x){return Math.sin(x*12.9898+x*78.233)*0.5+0.5;}

function drawFloatingPolaroids(t){
  for(var i=0;i<floatingPolaroids.length;i++){
    var fp=floatingPolaroids[i];
    var angle=fp.angle+t*fp.speed;
    var px=fp.baseX+Math.cos(angle)*fp.orbitR;
    var py=fp.baseY+Math.sin(angle)*fp.orbitR*0.4+Math.sin(t*fp.bobSpeed+fp.bobPhase)*fp.bobAmp;
    var depth=Math.sin(angle);
    var scale=0.6+depth*0.3;
    var tilt=Math.sin(t*0.001+fp.tiltPhase)*fp.tiltAmp;
    var sz=fp.size*scale;
    var alpha=0.5+depth*0.35;
    rc.save();
    rc.translate(px,py);
    rc.rotate(tilt);
    rc.globalAlpha=alpha;
    var borderW=sz*0.12;
    rc.fillStyle="#f5f0e0";
    rc.shadowColor="rgba(0,0,0,0.25)";rc.shadowBlur=4*scale;rc.shadowOffsetY=2*scale;
    rc.fillRect(-sz/2-borderW,-sz/2-borderW,sz+borderW*2,sz+borderW*2+borderW*1.5);
    rc.shadowBlur=0;rc.shadowOffsetY=0;
    var img=polaroidPhotos[fp.photoIdx];
    if(img&&img.complete&&img.naturalWidth>0){
      var imgScale=Math.min(sz/img.width,sz/img.height);
      var dW=img.width*imgScale,dH=img.height*imgScale;
      rc.drawImage(img,-dW/2,-dH/2,dW,dH);
    }else{
      rc.fillStyle="#ddd";rc.fillRect(-sz/2,-sz/2,sz,sz);
    }
    rc.strokeStyle="rgba(200,180,150,0.3)";rc.lineWidth=0.5;
    rc.strokeRect(-sz/2-borderW,-sz/2-borderW,sz+borderW*2,sz+borderW*2+borderW*1.5);
    rc.restore();
  }
  rc.globalAlpha=1;
}

function drawRoom(t){
  if(!rc)return;
  var scale=Math.min(W/CW,H/CH);
  var ox=(W-CW*scale)/2,oy=(H-CH*scale)/2;
  rc.setTransform(dpr,0,0,dpr,0,0);
  rc.clearRect(0,0,W,H);
  rc.fillStyle="#0a0610";rc.fillRect(0,0,W,H);
  rc.save();
  rc.translate(ox,oy);rc.scale(scale,scale);

  var phase=getDayPhase();

  var wr=Math.round(26+phase.brightness*24);
  var wg=Math.round(15+phase.brightness*18);
  var wb=Math.round(20+phase.brightness*12);
  rc.fillStyle="rgb("+wr+","+wg+","+wb+")";rc.fillRect(0,0,CW,CH);

  var fr=Math.round(18+phase.brightness*16);
  var fg=Math.round(10+phase.brightness*10);
  var fb=Math.round(16+phase.brightness*8);
  rc.fillStyle="rgb("+fr+","+fg+","+fb+")";rc.fillRect(0,350,CW,150);

  rc.strokeStyle="rgba(255,200,100,0.04)";rc.lineWidth=1;
  for(var fy=355;fy<CH;fy+=18){rc.beginPath();rc.moveTo(0,fy);rc.lineTo(CW,fy);rc.stroke();}

  rc.save();
  rc.shadowColor="rgba(200,160,64,0.5)";rc.shadowBlur=10;rc.shadowOffsetX=2;rc.shadowOffsetY=2;
  rc.fillStyle="#b8942e";rc.fillRect(248,2,64,48);
  rc.restore();
  rc.fillStyle="#8a6020";rc.fillRect(250,4,60,44);
  rc.fillStyle="#1a1a1a";rc.fillRect(253,7,54,38);
  rc.save();
  rc.beginPath();rc.rect(254,8,52,36);rc.clip();
  rc.globalAlpha=room.photoFade;
  var pImg=photos[room.photoIdx];
  if(pImg&&pImg.complete&&pImg.naturalWidth>0){
    var imgSc=Math.max(52/pImg.width,36/pImg.height);
    var dW=pImg.width*imgSc,dH=pImg.height*imgSc;
    rc.drawImage(pImg,254+(52-dW)/2,8+(36-dH)/2,dW,dH);
  }
  rc.restore();
  rc.globalAlpha=1;
  rc.strokeStyle="rgba(232,193,126,0.6)";rc.lineWidth=1.5;

  rc.fillStyle="#4a3020";rc.fillRect(270,55,70,240);rc.fillStyle="#3a2018";rc.fillRect(273,58,64,234);
  var bookColors=["#c04040","#4060c0","#40a040","#c08040","#8040c0","#c04080"];

    var shelfY=60+si*78;
    rc.fillStyle="#5a3818";rc.fillRect(270,shelfY+72,70,5);

      rc.fillStyle=bookColors[(si*4+bi)%bookColors.length];

      rc.fillRect(278+bi*15,shelfY+72-bh,11,bh);
    }
  }

  rc.fillStyle="#4a3020";rc.fillRect(22,50,100,160);
  var nightSkyR=Math.round(10-phase.brightness*4);
  var nightSkyG=Math.round(10-phase.brightness*2);
  var nightSkyB=Math.round(42-phase.brightness*10);
  rc.fillStyle="rgb("+nightSkyR+","+nightSkyG+","+nightSkyB+")";rc.fillRect(28,56,88,148);

  var winStars=[[45,75],[70,90],[90,70],[55,120],[80,140],[40,110],[95,105]];
  rc.fillStyle="#fff";
  for(var wi=0;wi<winStars.length;wi++){rc.globalAlpha=(1-phase.brightness)*(0.3+noise(t*0.0008+wi)*0.4);rc.beginPath();rc.arc(winStars[wi][0],winStars[wi][1],0.8+Math.sin(t*0.002+wi)*0.3,0,Math.PI*2);rc.fill();}
  rc.globalAlpha=1-phase.brightness;
  rc.fillStyle="rgba(220,220,180,0.6)";rc.beginPath();rc.arc(88,82,9,0,Math.PI*2);rc.fill();
  rc.fillStyle="rgb("+nightSkyR+","+nightSkyG+","+nightSkyB+")";rc.beginPath();rc.arc(85,80,8,0,Math.PI*2);rc.fill();
  rc.fillStyle="rgba(220,220,180,0.25)";rc.beginPath();rc.arc(88,82,12,0,Math.PI*2);rc.fill();
  rc.globalAlpha=1;

  if(phase.brightness>0){

    skyGrad.addColorStop(1,"rgba(160,210,255,"+phase.brightness+")");
    rc.fillStyle=skyGrad;rc.fillRect(28,56,88,148);
    rc.fillStyle="rgba(255,255,255,"+(phase.brightness*0.5)+")";
    var cld=(t*0.003)%80;
    rc.beginPath();rc.arc(50+cld-40,80,10,0,Math.PI*2);rc.arc(62+cld-40,75,13,0,Math.PI*2);rc.arc(74+cld-40,80,10,0,Math.PI*2);rc.fill();
    rc.fillStyle="rgba(255,255,255,"+(phase.brightness*0.35)+")";
    var cld2=(t*0.002+30)%90;
    rc.beginPath();rc.arc(40+cld2-45,140,8,0,Math.PI*2);rc.arc(52+cld2-45,136,11,0,Math.PI*2);rc.arc(63+cld2-45,140,8,0,Math.PI*2);rc.fill();
    rc.restore();
  }

  rc.strokeStyle="rgba(100,100,180,0.15)";rc.lineWidth=0.5;
  rc.beginPath();rc.moveTo(72,56);rc.lineTo(72,204);rc.stroke();

    }

      rd.y+=rd.speed;
      rd.x+=rd.angle*rd.speed;
      if(rd.y>204){room.rainDrops.splice(rdi,1);continue;}
      rc.strokeStyle="rgba(180,200,255,"+rd.opacity+")";rc.lineWidth=1;
      rc.beginPath();rc.moveTo(rd.x,rd.y);rc.lineTo(rd.x-rd.angle*rd.length,rd.y-rd.length);rc.stroke();

    rc.restore();

  if(room.shootStar){
    var ss=room.shootStar;
    rc.save();rc.globalAlpha=ss.life;
    rc.strokeStyle="rgba(255,255,220,"+ss.life+")";rc.lineWidth=1.5;
    rc.beginPath();rc.moveTo(ss.x-ss.vx*4,ss.y-ss.vy*4);rc.lineTo(ss.x,ss.y);rc.stroke();
    rc.fillStyle="rgba(255,255,255,"+ss.life+")";rc.beginPath();rc.arc(ss.x,ss.y,1.5,0,Math.PI*2);rc.fill();
    rc.restore();

  }

  if(phase.brightness>0.3){
    rc.save();rc.globalAlpha=phase.brightness*0.1;

  glow.addColorStop(0,"rgba(255,180,80,"+glowA+")");glow.addColorStop(0.5,"rgba(255,140,40,"+(glowA*0.4)+")");glow.addColorStop(1,"rgba(255,100,20,0)");
  rc.fillStyle=glow;rc.beginPath();rc.arc(100,255,glowR,0,Math.PI*2);rc.fill();

  rc.fillStyle=room.lampBright?"#ffdd66":"#aa8833";rc.beginPath();rc.moveTo(95,245);rc.lineTo(105,245);rc.lineTo(108,235);rc.lineTo(92,235);rc.closePath();rc.fill();
  if(room.lampBright){rc.save();rc.globalAlpha=0.15+Math.sin(t*0.003)*0.05;rc.fillStyle="#ffdd66";rc.beginPath();rc.arc(100,240,6,0,Math.PI*2);rc.fill();rc.restore();}

  rc.fillStyle="#f5f0e0";rc.fillRect(130,282,70,12);
  rc.strokeStyle="rgba(0,0,0,0.08)";rc.lineWidth=0.5;
  for(var li=0;li<5;li++){rc.beginPath();rc.moveTo(133,284+li*2.5);rc.lineTo(195,284+li*2.5);rc.stroke();}

  rc.fillText("Dear Rezil,",134,286);
  rc.fillStyle="rgba(120,60,60,0.5)";rc.font="3px Georgia,serif";
  rc.fillText("I love you more than",134,290);rc.fillText("all the stars in the",134,293);rc.fillText("sky and beyond forever.",134,296);
  rc.fillStyle="rgba(100,50,50,0.3)";rc.font="2.5px Georgia,serif";
  rc.fillText("You are my sunshine,",134,300);rc.fillText("my moonlight, my stars.",134,303);
  rc.fillStyle="#d4aa30";rc.save();rc.translate(205,288);rc.rotate(0.25);rc.fillRect(-1.5,-18,3,18);rc.restore();

  rc.fillStyle="#e8d8b8";rc.fillRect(244,280,6,12);
  rc.strokeStyle="rgba(160,130,80,0.6)";rc.lineWidth=0.5;rc.strokeRect(244,280,6,12);
  rc.fillStyle="#a08050";rc.fillRect(246,276,2,4);
  if(room.candleOn){
    var flameFlicker=Math.sin(t*0.008)*0.3+Math.sin(t*0.013)*0.2;
    var flameH=5+flameFlicker;
    var flameX=247;var flameBaseY=276;
    var cGlow=rc.createRadialGradient(flameX,flameBaseY-4,0,flameX,flameBaseY-4,20);
    cGlow.addColorStop(0,"rgba(255,160,40,0.25)");cGlow.addColorStop(0.5,"rgba(255,100,20,0.08)");cGlow.addColorStop(1,"rgba(255,60,10,0)");
    rc.fillStyle=cGlow;rc.beginPath();rc.arc(flameX,flameBaseY-4,20,0,Math.PI*2);rc.fill();
    rc.fillStyle="rgba(200,40,20,0.5)";rc.beginPath();rc.moveTo(flameX,flameBaseY);rc.quadraticCurveTo(flameX-2.5,flameBaseY-flameH*0.5,flameX,flameBaseY-flameH);rc.quadraticCurveTo(flameX+2.5,flameBaseY-flameH*0.5,flameX,flameBaseY);rc.closePath();rc.fill();
    rc.fillStyle="rgba(255,140,20,0.6)";rc.beginPath();rc.moveTo(flameX,flameBaseY);rc.quadraticCurveTo(flameX-1.8,flameBaseY-flameH*0.45,flameX,flameBaseY-flameH*0.85);rc.quadraticCurveTo(flameX+1.8,flameBaseY-flameH*0.45,flameX,flameBaseY);rc.closePath();rc.fill();
    rc.fillStyle="rgba(255,220,80,0.8)";rc.beginPath();rc.moveTo(flameX,flameBaseY);rc.quadraticCurveTo(flameX-1,flameBaseY-flameH*0.35,flameX,flameBaseY-flameH*0.6);rc.quadraticCurveTo(flameX+1,flameBaseY-flameH*0.35,flameX,flameBaseY);rc.closePath();rc.fill();
    rc.fillStyle="rgba(255,255,200,0.9)";rc.beginPath();rc.arc(flameX,flameBaseY-flameH*0.3,0.8,0,Math.PI*2);rc.fill();
  }

  var twx=210,twy=278,tww=52,twh=16;
  rc.fillStyle="#4a4a52";rc.beginPath();rc.roundRect(twx,twy,tww,twh,3);rc.fill();
  rc.strokeStyle="rgba(255,255,255,0.1)";rc.lineWidth=0.5;rc.beginPath();rc.roundRect(twx,twy,tww,twh,3);rc.stroke();
  rc.fillStyle="#3a3a42";rc.fillRect(twx+2,twy-2,tww-4,4);
  rc.fillStyle="#f5f0e0";rc.fillRect(twx+5,twy-20,tww-10,18);
  rc.save();rc.beginPath();rc.rect(twx+5,twy-20,tww-10,18);rc.clip();
  var tw=room.typewriter;
  var paperLineH=2.8;var paperX=twx+7;var paperBaseY=twy-4;
  var allTW=tw.lines.slice();
  if(tw.typing&&tw.currentMsg)allTW.push(tw.currentMsg.substring(0,tw.charIdx));
  var visLines=allTW.slice(-6);
  for(var vi=0;vi<visLines.length;vi++){
    var age=visLines.length-1-vi;
    rc.globalAlpha=age<4?0.8:0.4;
    rc.fillStyle="#333";rc.font="2px Georgia,serif";rc.textAlign="left";
    rc.fillText(visLines[vi],paperX,paperBaseY-(visLines.length-1-vi)*paperLineH);
  }
  rc.globalAlpha=1;rc.restore();
  rc.fillStyle="#333";
  for(var ki=0;ki<7;ki++){rc.beginPath();rc.arc(twx+8+ki*6,twy+twh-4,2,0,Math.PI*2);rc.fill();}
  rc.fillRect(twx+16,twy+twh-2,20,2);

  for(var fni=0;fni<room.floatingNotes.length;fni++){
    var fn=room.floatingNotes[fni];
    rc.save();
    rc.globalAlpha=fn.opacity;
    rc.translate(fn.x,fn.y);rc.rotate(fn.rotation);
    rc.fillStyle="#f0e8d0";rc.fillRect(-3,-2,6,4);
    rc.strokeStyle="rgba(180,160,120,0.4)";rc.lineWidth=0.3;rc.strokeRect(-3,-2,6,4);
    rc.restore();
  }

  rc.fillStyle="#180f14";rc.beginPath();rc.arc(180,38,24,0,Math.PI*2);rc.fill();
  rc.strokeStyle="#e8c17e";rc.lineWidth=1.5;rc.beginPath();rc.arc(180,38,24,0,Math.PI*2);rc.stroke();
  rc.fillStyle="#e8c17e";
  for(var hi=0;hi<12;hi++){var ha=hi*Math.PI/6-Math.PI/2;rc.beginPath();rc.arc(180+Math.cos(ha)*20,38+Math.sin(ha)*20,1.3,0,Math.PI*2);rc.fill();}
  var now=new Date();var h=now.getHours()%12;var m=now.getMinutes();
  var ha2=(h+m/60)*Math.PI/6-Math.PI/2;var ma2=m*Math.PI/30-Math.PI/2;
  rc.strokeStyle="#e8c17e";rc.lineWidth=2.5;rc.beginPath();rc.moveTo(180,38);rc.lineTo(180+Math.cos(ha2)*11,38+Math.sin(ha2)*11);rc.stroke();
  rc.lineWidth=1.5;rc.beginPath();rc.moveTo(180,38);rc.lineTo(180+Math.cos(ma2)*16,38+Math.sin(ma2)*16);rc.stroke();
  rc.fillStyle="#e8c17e";rc.beginPath();rc.arc(180,38,2,0,Math.PI*2);rc.fill();

  var breath=Math.sin(t*0.002)*0.025;var headTilt=Math.sin(t*0.001)*0.04;
  var tiltBurst=Math.sin(t*0.0005)>0.93?Math.sin(t*0.012)*0.1:0;
  headTilt+=tiltBurst;
  rc.save();rc.translate(170,240);rc.scale(1+breath,1-breath*0.5);
  rc.fillStyle="#d88828";rc.beginPath();rc.ellipse(-6,20,5,3,-0.2,0,Math.PI*2);rc.fill();
  rc.beginPath();rc.ellipse(6,20,5,3,0.2,0,Math.PI*2);rc.fill();
  rc.fillStyle="#ffe040";rc.beginPath();rc.ellipse(0,3,14,16,0,0,Math.PI*2);rc.fill();
  rc.fillStyle="#ffe840";rc.beginPath();rc.arc(0,-10,12,0,Math.PI*2);rc.fill();
  rc.fillStyle="#fff8e0";rc.beginPath();rc.arc(-3,-14,4,0,Math.PI*2);rc.fill();rc.beginPath();rc.arc(4,-13,3,0,Math.PI*2);rc.fill();
  rc.save();rc.rotate(headTilt);
  rc.fillStyle="#1a1a2e";rc.beginPath();rc.arc(-3,-11,2.5,0,Math.PI*2);rc.fill();rc.beginPath();rc.arc(3,-11,2.5,0,Math.PI*2);rc.fill();
  rc.fillStyle="#fff";rc.beginPath();rc.arc(-2.5,-12,1,0,Math.PI*2);rc.fill();rc.beginPath();rc.arc(3.5,-12,0.8,0,Math.PI*2);rc.fill();
  rc.fillStyle="#e88030";rc.beginPath();rc.moveTo(0,-7.5);rc.lineTo(-2.5,-6);rc.lineTo(2.5,-6);rc.closePath();rc.fill();
  rc.restore();
  if(room.chikoyWave){
    var wt=Math.min(room.waveTimer/1000,1);
    var armAngle=wt<0.3?wt/0.3*-1.3:wt<0.7?-1.3:(wt-0.7)/0.3*1.3;
    rc.save();rc.translate(14,0);rc.rotate(armAngle);rc.fillStyle="#ffe040";rc.beginPath();rc.ellipse(0,-5,4,9,0.3,0,Math.PI*2);rc.fill();rc.restore();
  }else{
    rc.fillStyle="#ffe040";rc.beginPath();rc.ellipse(14,0,4,9,0.3,0,Math.PI*2);rc.fill();
  }
  rc.restore();

  drawFloatingPolaroids(t);

  for(var di=0;di<room.dust.length;di++){
    var d=room.dust[di];
    d.x+=d.vx+Math.sin(t*0.0003+d.ph)*0.04;
    d.y+=d.vy;
    if(d.y<100){d.y=380;d.x=40+Math.random()*140;}
    if(d.x<30||d.x>180){d.x=40+Math.random()*140;d.y=130+Math.random()*250;}
    var dx_=ox+d.x*scale,dy_=oy+d.y*scale;
    rc.globalAlpha=d.a*(room.lampBright?1:0.3);
    rc.fillStyle="rgba(255,230,180,0.8)";
    rc.beginPath();rc.arc(dx_,dy_,d.sz*scale*0.5,0,Math.PI*2);rc.fill();
  }
  rc.globalAlpha=1;

  if(room.letterOpen){
    room.letterZoom=Math.min(1,room.letterZoom+0.06);
    var lz=room.letterZoom;
    rc.save();
    rc.setTransform(dpr,0,0,dpr,0,0);
    rc.fillStyle="rgba(10,6,16,"+(0.85*lz)+")";rc.fillRect(0,0,W,H);
    var cx=W/2,cy=H/2;
    var lw=Math.min(340,W*0.88)*lz;
    var lh=Math.min(420,H*0.75)*lz;
    var lx=cx-lw/2,ly=cy-lh/2;
    rc.shadowColor="rgba(255,180,80,0.3)";rc.shadowBlur=30*lz;
    rc.fillStyle="#1a0f14";rc.beginPath();
    rc.roundRect(lx,ly,lw,lh,12*lz);rc.fill();
    rc.shadowBlur=0;
    rc.strokeStyle="rgba(232,193,126,"+(0.4*lz)+")";rc.lineWidth=1;
    rc.beginPath();rc.roundRect(lx,ly,lw,lh,12*lz);rc.stroke();
    if(lz>0.5){
      var fa=(lz-0.5)*2;
      rc.globalAlpha=fa;
      rc.fillStyle="rgba(232,193,126,0.9)";rc.font="bold "+Math.round(14*lz)+"px Georgia,serif";rc.textAlign="center";
      rc.fillText("\u2764\uFE0F",cx,ly+30*lz);
      rc.fillStyle="rgba(232,193,126,0.6)";rc.font=Math.round(8*lz)+"px 'Segoe UI',sans-serif";
      rc.fillText("A letter from Chikoy",cx,ly+44*lz);
      rc.textAlign="left";
      var tx=lx+24*lz,ty=ly+70*lz;
      var lineH=18*lz;
      rc.fillStyle="rgba(255,247,238,0.85)";rc.font="italic "+Math.round(11*lz)+"px Georgia,serif";
      var lines=["Dear Rezil,","","I know I'm just a little chick,","but I wanted you to know","how special you are.","","Every star in the sky","reminds me of your smile.","Every sunset reminds me","of the warmth you bring.","","Nard made this sky for you,","and I just live in it.","But I'm happy here,","because you visit sometimes.","","Thank you for being","the most beautiful person","in this whole universe.","","With all my tiny feathers,","Chikoy \uD83D\uDC25"];
      for(var lli=0;lli<lines.length;lli++){
        if(ty+lli*lineH>ly+lh-30*lz)break;
        rc.fillText(lines[lli],tx,ty+lli*lineH);
      }
      rc.textAlign="center";
      rc.fillStyle="rgba(232,193,126,0.4)";rc.font=Math.round(7*lz)+"px 'Segoe UI',sans-serif";
      rc.fillText("tap anywhere to close",cx,ly+lh-14*lz);
      rc.globalAlpha=1;
    }
    rc.restore();
  }else{
    room.letterZoom=0;
  }

  if(room.photoZoom){
    room.photoZoomScale=Math.min(1,room.photoZoomScale+0.06);
    var zs=room.photoZoomScale;
    rc.save();
    rc.setTransform(dpr,0,0,dpr,0,0);
    rc.fillStyle="rgba(10,6,16,"+(0.9*zs)+")";rc.fillRect(0,0,W,H);
    var pzImg=photos[room.photoIdx];
    if(pzImg&&pzImg.complete&&pzImg.naturalWidth>0){
      var maxW=W*0.88,maxH=H*0.75;
      var pzSc=Math.min(maxW/pzImg.width,maxH/pzImg.height);
      var pdW=pzImg.width*pzSc*zs,pdH=pzImg.height*pzSc*zs;
      rc.shadowColor="rgba(255,180,80,0.3)";rc.shadowBlur=30*zs;
      rc.drawImage(pzImg,(W-pdW)/2,(H-pdH)/2,pdW,pdH);
      rc.shadowBlur=0;
    }
    rc.globalAlpha=zs>0.5?(zs-0.5)*2:0;
    rc.fillStyle="rgba(232,193,126,0.5)";rc.font="12px 'Segoe UI',sans-serif";rc.textAlign="center";
    rc.fillText("tap to close",W/2,H*0.88);
    rc.globalAlpha=1;
    rc.restore();
  }else{
    room.photoZoomScale=0;
  }
}

function frame(ts){
  if(!lastTime)lastTime=ts;
  dt=ts-lastTime;lastTime=ts;
  time=ts;

  room.photoTimer+=dt;
  if(room.photoTimer>=8000){room.photoTimer-=8000;room.photoIdx=(room.photoIdx+1)%5;}
  if(room.photoTimer<800){room.photoFade=room.photoTimer/800;}
  else if(room.photoTimer>7200){room.photoFade=(8000-room.photoTimer)/800;}
  else{room.photoFade=1;}

  var tw=room.typewriter;
  if(!tw.typing&&!room.photoZoom&&!room.letterOpen){
    if(time-tw.lastAutoType>30000){
      tw.typing=true;tw.charIdx=0;
      tw.currentMsg=loveMessages[tw.msgIdx%loveMessages.length];
      tw.msgIdx++;tw.lastAutoType=time;tw.lastType=time;
    }
  }
  if(tw.typing){
    if(time-tw.lastType>50){
      tw.charIdx++;tw.lastType=time;
      if(navigator.vibrate&&tw.charIdx%3===0)navigator.vibrate(5);
      if(tw.charIdx>=tw.currentMsg.length){
        tw.typing=false;tw.lines.push(tw.currentMsg);
        if(tw.lines.length>6)tw.lines.shift();
        tw.lastAutoType=time;
        var noteCount=2+Math.floor(Math.random()*2);
        for(var ni=0;ni<noteCount;ni++){
          if(room.floatingNotes.length>=8)room.floatingNotes.shift();
          room.floatingNotes.push({x:236+Math.random()*16,y:260,vx:(Math.random()-0.5)*0.3,vy:-0.3-Math.random()*0.2,rotation:(Math.random()-0.5)*0.6,rotSpeed:(Math.random()-0.5)*0.005,life:1,opacity:0.8});
        }
      }
    }
  }

  for(var fn2=room.floatingNotes.length-1;fn2>=0;fn2--){
    var fn3=room.floatingNotes[fn2];
    fn3.x+=fn3.vx;fn3.y+=fn3.vy;fn3.rotation+=fn3.rotSpeed;
    fn3.life-=0.008;fn3.opacity=fn3.life*0.8;
    if(fn3.life<=0)room.floatingNotes.splice(fn2,1);
  }

  var phase=getDayPhase();
  if(!phase.isDay&&room.rainDrops.length>0&&!room.raining){room.rainDrops=[];}
  if(!phase.isDay&&room.raining&&room.rainDrops.length<30){
    for(var rai=0;rai<2;rai++){
      room.rainDrops.push({x:28+Math.random()*88,y:56,speed:1.5+Math.random()*2,length:8+Math.random()*7,opacity:0.3+Math.random()*0.15,angle:-0.05+Math.random()*0.1});
    }
  }

  drawRoom(time);
  if(room.chikoyWave){room.waveTimer+=dt;if(room.waveTimer>1200)room.chikoyWave=false;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.scrollTo(0,0);
})();
