<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Flowers for You</title>
  <meta name="theme-color" content="#1a0f14">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <style>
    body {
      background: #120a10;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--cream);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .bg-fade {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(224,86,124,0.28), transparent 60%),
        radial-gradient(900px 500px at 100% 110%, rgba(232,193,126,0.12), transparent 55%),
        linear-gradient(180deg, #1a0f14, #120a10);
    }

    .flowers-page {
      position: relative; z-index: 1;
      text-align: center;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 1rem;
    }

    .flowers-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 400;
      background: linear-gradient(90deg, #ffd3e0, var(--gold), #fff, var(--gold), #ffd3e0);
      background-size: 250% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 5s linear infinite;
      margin-bottom: 0.3rem;
      z-index: 5;
    }

    .flowers-subtitle {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 0.95rem;
      font-style: italic;
      color: rgba(255,247,238,0.5);
      margin-bottom: 1rem;
      z-index: 5;
    }

    .drag-hint {
      font-size: 0.7rem;
      color: rgba(255,247,238,0.35);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      z-index: 5;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.7; }
    }

    /* ── 3D Scene ── */
    .scene {
      width: 300px;
      height: 360px;
      perspective: 800px;
      position: relative;
      z-index: 5;
      margin: 0 auto;
    }

    .bouquet {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-10deg) rotateY(0deg);
      transition: transform 0.05s linear;
    }

    .bouquet.dragging {
      transition: none;
    }

    /* ── Stem ── */
    .stem {
      position: absolute;
      bottom: 20px;
      left: 50%;
      width: 4px;
      height: 160px;
      background: linear-gradient(to top, #2d5a1e, #4a8c2a);
      transform: translateX(-50%);
      border-radius: 2px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.3);
    }

    .stem::before {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 20px;
      background: linear-gradient(to top, rgba(45,90,30,0), #2d5a1e);
      border-radius: 0 0 15px 15px;
    }

    /* ── Ribbon ── */
    .ribbon {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateZ(5px);
      width: 40px;
      height: 12px;
      background: linear-gradient(135deg, #e0567c, #ff8fab);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(224,86,124,0.4);
    }

    .ribbon::before, .ribbon::after {
      content: '';
      position: absolute;
      top: 100%;
      width: 8px;
      height: 25px;
      border-radius: 0 0 4px 4px;
    }

    .ribbon::before {
      left: 6px;
      background: linear-gradient(to bottom, #e0567c, rgba(224,86,124,0.3));
      transform: rotate(-8deg);
    }

    .ribbon::after {
      right: 6px;
      background: linear-gradient(to bottom, #ff8fab, rgba(255,143,171,0.3));
      transform: rotate(8deg);
    }

    /* ── Flower heads ── */
    .flower-head {
      position: absolute;
      font-size: 2.2rem;
      cursor: pointer;
      transition: filter 0.3s ease, transform 0.3s var(--spring);
      transform-style: preserve-3d;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      z-index: 2;
    }

    .flower-head:hover {
      filter: drop-shadow(0 6px 16px rgba(255,143,171,0.5)) brightness(1.2);
      z-index: 10;
    }

    .flower-head.active {
      filter: drop-shadow(0 0 20px rgba(255,143,171,0.7)) brightness(1.3);
      z-index: 10;
    }

    .flower-head .tooltip {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%) translateZ(20px);
      background: rgba(26,15,20,0.95);
      border: 1px solid rgba(255,143,171,0.4);
      border-radius: 8px;
      padding: 0.3rem 0.6rem;
      white-space: nowrap;
      font-size: 0.7rem;
      color: var(--cream);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    .flower-head:hover .tooltip,
    .flower-head.active .tooltip {
      opacity: 1;
    }

    /* ── Leaves ── */
    .leaf {
      position: absolute;
      width: 20px;
      height: 30px;
      background: #3a7a22;
      border-radius: 50% 0 50% 0;
      transform-origin: bottom center;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.2);
    }

    /* ── Flower message panel ── */
    .flower-message {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(18,10,16,0.98), rgba(18,10,16,0.85), transparent);
      padding: 1.5rem 1.5rem 2rem;
      z-index: 20;
      transform: translateY(100%);
      transition: transform 0.5s var(--spring);
    }

    .flower-message.show {
      transform: translateY(0);
    }

    .flower-message h3 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.2rem;
      color: var(--gold);
      margin-bottom: 0.3rem;
    }

    .flower-message p {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1rem;
      font-style: italic;
      color: rgba(255,247,238,0.75);
      line-height: 1.5;
    }

    .flower-message .close-msg {
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      background: none;
      border: none;
      color: rgba(255,247,238,0.4);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* ── Back link ── */
    .back-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--cream);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      border: 1px solid rgba(255,143,171,0.3);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      transition: all 0.3s ease;
      background: rgba(18,10,16,0.6);
      backdrop-filter: blur(8px);
    }

    .back-link:hover {
      background: rgba(224,86,124,0.2);
      border-color: rgba(255,143,171,0.6);
    }

    /* ── Petals ── */
    .petal {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      font-size: 1rem;
      opacity: 0;
      animation: petalFall linear forwards;
    }

    @keyframes petalFall {
      0% { opacity: 0.9; transform: translateY(-20px) rotate(0deg) scale(1); }
      50% { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.5); }
    }

    /* ── Sparkle ring around bouquet ── */
    .sparkle-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 220px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255,143,171,0.08);
      animation: sparkleRing 4s linear infinite;
      pointer-events: none;
    }

    @keyframes sparkleRing {
      0% { transform: translate(-50%, -50%) rotate(0deg); border-color: rgba(255,143,171,0.08); }
      50% { border-color: rgba(255,143,171,0.2); }
      100% { transform: translate(-50%, -50%) rotate(360deg); border-color: rgba(255,143,171,0.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bouquet { transition: none; }
      .petal { animation: none; display: none; }
      .sparkle-ring { animation: none; }
      .drag-hint { animation: none; }
    }

    @media (max-height: 650px) {
      .scene { height: 280px; width: 240px; }
      .stem { height: 120px; }
      .flower-head { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="bg-fade"></div>

  <a href="lovepage.html" class="back-link">← back</a>

  <div class="flowers-page">
    <h1 class="flowers-title">A Bouquet for You</h1>
    <p class="flowers-subtitle">drag to rotate · tap a flower</p>
    <div class="drag-hint" id="dragHint">✦ drag to spin ✦</div>

    <div class="scene" id="scene">
      <div class="sparkle-ring"></div>
      <div class="bouquet" id="bouquet">
        <div class="stem"></div>
        <div class="ribbon"></div>
        <!-- Leaves -->
        <div class="leaf" style="bottom:80px;left:calc(50% - 18px);transform:rotate(-30deg) translateZ(-3px)"></div>
        <div class="leaf" style="bottom:100px;left:calc(50% + 6px);transform:rotate(30deg) scaleX(-1) translateZ(4px)"></div>
        <div class="leaf" style="bottom:60px;left:calc(50% + 4px);transform:rotate(25deg) scaleX(-1) translateZ(-5px)"></div>
        <!-- Flowers placed by JS -->
      </div>
    </div>

    <div class="flower-message" id="flowerMessage">
      <button class="close-msg" id="closeMsg">✕</button>
      <h3 id="flowerName"></h3>
      <p id="flowerText"></p>
    </div>
  </div>

  <script src="anniversary.js"></script>
  <script src="app.js"></script>
  <script>
  (function(){
    var flowers = [
      { emoji: "🌹", name: "Red Rose",     meaning: "I love you",              msg: "You are the love of my life. Every beat of my heart spells your name." },
      { emoji: "🌻", name: "Sunflower",    meaning: "I adore you",             msg: "You are my sunshine. Wherever you go, my eyes will follow." },
      { emoji: "🌷", name: "Tulip",        meaning: "Perfect love",            msg: "Our love is perfect, just as it is. I wouldn't change a thing." },
      { emoji: "🌸", name: "Cherry Blossom", meaning: "Beauty & grace",        msg: "You are the most beautiful thing that has ever happened to me." },
      { emoji: "🌼", name: "Daisy",        meaning: "Innocent love",           msg: "I fell in love with your innocence, your kindness, your soul." },
      { emoji: "🪷", name: "Lotus",        meaning: "Purity of heart",         msg: "Your heart is pure gold. I am lucky to be loved by you." },
      { emoji: "🌺", name: "Hibiscus",     meaning: "Delicate beauty",         msg: "You are delicate yet strong. My forever flower." },
      { emoji: "🏵️", name: "Bouquet",      meaning: "Gratitude",               msg: "This bouquet is just a fraction of my love for you." },
      { emoji: "💮", name: "White Rose",   meaning: "Pure devotion",           msg: "My love for you is pure, eternal, and unconditional." },
      { emoji: "🌸", name: "Pink Rose",    meaning: "Gentle love",             msg: "Every petal of my love is colored with your name." },
      { emoji: "🌼", name: "Calendula",    meaning: "Warmth & joy",            msg: "You bring warmth to my coldest days and joy to my quietest moments." },
      { emoji: "🌺", name: "Plumeria",     meaning: "New beginnings",          msg: "Every day with you is a beautiful new beginning." }
    ];

    var bouquet = document.getElementById("bouquet");
    var scene = document.getElementById("scene");
    var flowerMessage = document.getElementById("flowerMessage");
    var flowerName = document.getElementById("flowerName");
    var flowerText = document.getElementById("flowerText");
    var closeMsg = document.getElementById("closeMsg");
    var dragHint = document.getElementById("dragHint");

    var rotX = -10, rotY = 0;
    var autoRotY = 0;
    var isDragging = false;
    var startX = 0, startY = 0;
    var startRotX = 0, startRotY = 0;
    var autoRotate = true;
    var rafId = null;
    var hintTimer = null;

    // ── Place flowers in 3D sphere ──
    function placeFlowers(){
      var existing = bouquet.querySelectorAll(".flower-head");
      existing.forEach(function(e){ e.remove(); });

      var total = flowers.length;
      // Arrange in layers: top ring, middle ring, bottom
      var layers = [
        { count: 4, radiusX: 75, radiusZ: 75, y: -40,   rotOffset: 0 },
        { count: 5, radiusX: 95, radiusZ: 95, y: 10,    rotOffset: 36 },
        { count: 3, radiusX: 60, radiusZ: 60, y: 55,    rotOffset: 60 }
      ];

      var idx = 0;
      layers.forEach(function(layer){
        for(var i = 0; i < layer.count && idx < total; i++){
          var angle = (360 / layer.count) * i + layer.rotOffset;
          var rad = angle * Math.PI / 180;
          var x = Math.sin(rad) * layer.radiusX;
          var z = Math.cos(rad) * layer.radiusZ;
          var y = layer.y;

          var f = flowers[idx];
          var el = document.createElement("div");
          el.className = "flower-head";
          el.setAttribute("data-idx", idx);
          el.innerHTML = f.emoji + '<span class="tooltip">' + f.name + '</span>';
          el.style.cssText = "left:calc(50% + " + x + "px);top:calc(50% + " + y + "px);transform:translate(-50%,-50%) translateZ(" + z + "px)";
          el.style.fontSize = (1.8 + Math.random() * 0.6) + "rem";

          el.addEventListener("click", function(e){
            e.stopPropagation();
            var fi = parseInt(this.getAttribute("data-idx"));
            showFlowerMessage(fi);
            bouquet.querySelectorAll(".flower-head").forEach(function(h){ h.classList.remove("active"); });
            this.classList.add("active");
            spawnPetals(6);
            try { navigator.vibrate(15); } catch(err){}
          });

          bouquet.appendChild(el);
          idx++;
        }
      });
    }

    // ── Show flower message ──
    function showFlowerMessage(idx){
      var f = flowers[idx];
      flowerName.textContent = f.emoji + " " + f.name + " — " + f.meaning;
      flowerText.textContent = f.msg;
      flowerMessage.classList.add("show");
    }

    closeMsg.addEventListener("click", function(){
      flowerMessage.classList.remove("show");
      bouquet.querySelectorAll(".flower-head").forEach(function(h){ h.classList.remove("active"); });
    });

    scene.addEventListener("click", function(){
      flowerMessage.classList.remove("show");
      bouquet.querySelectorAll(".flower-head").forEach(function(h){ h.classList.remove("active"); });
    });

    // ── Drag to rotate ──
    function onPointerDown(e){
      if(e.target.closest(".flower-head") || e.target.closest(".back-link") || e.target.closest(".close-msg")) return;
      isDragging = true;
      autoRotate = false;
      startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      startY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      startRotX = rotX;
      startRotY = rotY;
      bouquet.classList.add("dragging");
      if(dragHint) dragHint.style.opacity = "0";
      clearTimeout(hintTimer);
    }

    function onPointerMove(e){
      if(!isDragging) return;
      var cx = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      var cy = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      var dx = cx - startX;
      var dy = cy - startY;
      rotY = startRotY + dx * 0.5;
      rotX = Math.max(-40, Math.min(30, startRotX - dy * 0.3));
      bouquet.style.transform = "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
    }

    function onPointerUp(){
      if(!isDragging) return;
      isDragging = false;
      bouquet.classList.remove("dragging");
      // Resume auto-rotate after 3 seconds
      clearTimeout(hintTimer);
      hintTimer = setTimeout(function(){ autoRotate = true; }, 3000);
    }

    scene.addEventListener("mousedown", onPointerDown);
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("mouseup", onPointerUp);
    scene.addEventListener("touchstart", onPointerDown, { passive: true });
    window.addEventListener("touchmove", onPointerMove, { passive: true });
    window.addEventListener("touchend", onPointerUp);

    // ── Auto rotation loop ──
    function animate(){
      if(autoRotate){
        autoRotY += 0.3;
        rotY = autoRotY;
        rotX = -10 + Math.sin(autoRotY * 0.01) * 5;
        bouquet.style.transform = "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
      }
      rafId = requestAnimationFrame(animate);
    }

    // ── Spawn petals ──
    function spawnPetals(count){
      var petals = ["🌸","🌹","🌷","🌺","💮","🏵️","✨","💗"];
      for(var i = 0; i < (count || 8); i++){
        (function(d){
          setTimeout(function(){
            var el = document.createElement("span");
            el.className = "petal";
            el.textContent = petals[Math.floor(Math.random() * petals.length)];
            el.style.left = (20 + Math.random() * 60) + "vw";
            el.style.animationDuration = (Math.random() * 3 + 3) + "s";
            document.body.appendChild(el);
            setTimeout(function(){ el.remove(); }, 6000);
          }, d);
        })(i * 150);
      }
    }

    // ── Init ──
    placeFlowers();
    animate();

    // Initial petal burst
    setTimeout(function(){ spawnPetals(10); }, 500);

    // Hide hint after 5 seconds
    setTimeout(function(){ if(dragHint) dragHint.style.opacity = "0"; }, 5000);
  })();
  </script>
</body>
</html>
