<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Flowers for You</title>
  <meta name="theme-color" content="#1a0f14">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <style>
    body {
      background: #0e0810;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--cream);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .bg-fade {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(900px 500px at 50% 40%, rgba(224,86,124,0.12), transparent 60%),
        radial-gradient(600px 400px at 30% 70%, rgba(180,60,100,0.08), transparent 50%),
        radial-gradient(600px 400px at 70% 30%, rgba(232,193,126,0.06), transparent 50%),
        linear-gradient(180deg, #140c12, #0e0810);
    }

    /* ── Ambient canvas ── */
    #ambientCanvas {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
    }

    .flowers-page {
      position: relative; z-index: 2;
      text-align: center;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 1rem;
    }

    .flowers-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 400;
      background: linear-gradient(90deg, #ffd3e0, var(--gold), #fff, var(--gold), #ffd3e0);
      background-size: 250% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 5s linear infinite;
      margin-bottom: 0.2rem;
      z-index: 5;
      text-shadow: 0 0 40px rgba(255,143,171,0.15);
    }

    .flowers-subtitle {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 0.9rem;
      font-style: italic;
      color: rgba(255,247,238,0.45);
      margin-bottom: 0.6rem;
      z-index: 5;
    }

    .drag-hint {
      font-size: 0.65rem;
      color: rgba(255,247,238,0.3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      z-index: 5;
      animation: hintPulse 2.5s ease-in-out infinite;
    }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    /* ── 3D Scene ── */
    .scene {
      width: 300px;
      height: 360px;
      perspective: 900px;
      perspective-origin: 50% 45%;
      position: relative;
      z-index: 5;
      margin: 0 auto;
    }

    /* ── Bouquet glow (behind everything) ── */
    .bouquet-glow {
      position: absolute;
      top: 30%;
      left: 50%;
      width: 260px;
      height: 260px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(224,86,124,0.15) 0%, rgba(224,86,124,0.05) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: glowPulse 4s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }

    /* ── Second glow ring ── */
    .bouquet-glow-ring {
      position: absolute;
      top: 30%;
      left: 50%;
      width: 300px;
      height: 300px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255,143,171,0.06);
      pointer-events: none;
      animation: ringRotate 8s linear infinite;
      z-index: 0;
    }

    .bouquet-glow-ring::before {
      content: '';
      position: absolute;
      top: -2px; left: 50%;
      width: 4px; height: 4px;
      background: rgba(255,143,171,0.4);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255,143,171,0.6);
    }

    @keyframes ringRotate {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .bouquet {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-10deg) rotateY(0deg);
      transition: transform 0.05s linear;
      z-index: 1;
    }

    .bouquet.dragging {
      transition: none;
    }

    /* ── Stem ── */
    .stem {
      position: absolute;
      bottom: 20px;
      left: 50%;
      width: 5px;
      height: 160px;
      background: linear-gradient(to top, #1e4012, #2d6a1e, #3a8a28);
      transform: translateX(-50%);
      border-radius: 3px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.4), -1px 0 6px rgba(0,0,0,0.2);
    }

    .stem::before {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 35px;
      height: 22px;
      background: linear-gradient(to top, rgba(30,64,18,0), #1e4012);
      border-radius: 0 0 18px 18px;
    }

    /* ── Ribbon ── */
    .ribbon {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateZ(6px);
      width: 44px;
      height: 14px;
      background: linear-gradient(135deg, #c94070, #e0567c, #ff8fab);
      border-radius: 7px;
      box-shadow: 0 3px 12px rgba(224,86,124,0.5), 0 0 20px rgba(224,86,124,0.15);
    }

    .ribbon::before, .ribbon::after {
      content: '';
      position: absolute;
      top: 100%;
      width: 9px;
      height: 28px;
      border-radius: 0 0 5px 5px;
    }

    .ribbon::before {
      left: 7px;
      background: linear-gradient(to bottom, #c94070, rgba(201,64,112,0.2));
      transform: rotate(-10deg);
    }

    .ribbon::after {
      right: 7px;
      background: linear-gradient(to bottom, #ff8fab, rgba(255,143,171,0.2));
      transform: rotate(10deg);
    }

    /* ── Flower heads ── */
    .flower-head {
      position: absolute;
      font-size: 2.2rem;
      cursor: pointer;
      transition: filter 0.3s ease, transform 0.3s var(--spring);
      transform-style: preserve-3d;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
      z-index: 2;
    }

    .flower-head::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,143,171,0.08), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .flower-head:hover {
      filter: drop-shadow(0 6px 20px rgba(255,143,171,0.5)) brightness(1.25);
      z-index: 10;
    }

    .flower-head:hover::after {
      opacity: 1;
    }

    .flower-head.active {
      filter: drop-shadow(0 0 24px rgba(255,143,171,0.7)) drop-shadow(0 0 48px rgba(224,86,124,0.3)) brightness(1.35);
      z-index: 10;
    }

    .flower-head.active::after {
      opacity: 1;
      background: radial-gradient(circle, rgba(255,143,171,0.15), transparent 70%);
    }

    .flower-head .tooltip {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%) translateZ(20px);
      background: rgba(14,8,16,0.92);
      border: 1px solid rgba(255,143,171,0.35);
      border-radius: 8px;
      padding: 0.3rem 0.65rem;
      white-space: nowrap;
      font-size: 0.7rem;
      color: var(--cream);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      font-family: "Cormorant Garamond", Georgia, serif;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .flower-head:hover .tooltip,
    .flower-head.active .tooltip {
      opacity: 1;
    }

    /* ── Leaves ── */
    .leaf {
      position: absolute;
      width: 22px;
      height: 34px;
      background: linear-gradient(135deg, #2a6a18, #3a8a28);
      border-radius: 50% 0 50% 0;
      transform-origin: bottom center;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
    }

    .leaf::after {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      width: 1px;
      height: 50%;
      background: rgba(255,255,255,0.1);
      transform: translateX(-50%) rotate(5deg);
    }

    /* ── Flower message panel ── */
    .flower-message {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(14,8,16,0.98) 60%, rgba(14,8,16,0.9) 80%, transparent);
      padding: 2rem 1.5rem 2.5rem;
      z-index: 20;
      transform: translateY(100%);
      transition: transform 0.5s var(--spring);
    }

    .flower-message.show {
      transform: translateY(0);
    }

    .flower-message h3 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.2rem;
      color: var(--gold);
      margin-bottom: 0.4rem;
      text-shadow: 0 0 20px rgba(232,193,126,0.2);
    }

    .flower-message p {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1rem;
      font-style: italic;
      color: rgba(255,247,238,0.7);
      line-height: 1.6;
    }

    .flower-message .close-msg {
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      background: none;
      border: none;
      color: rgba(255,247,238,0.35);
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .flower-message .close-msg:hover {
      color: rgba(255,247,238,0.7);
    }

    /* ── Back link ── */
    .back-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--cream);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      border: 1px solid rgba(255,143,171,0.25);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      transition: all 0.3s ease;
      background: rgba(14,8,16,0.5);
      backdrop-filter: blur(10px);
    }

    .back-link:hover {
      background: rgba(224,86,124,0.15);
      border-color: rgba(255,143,171,0.5);
    }

    /* ── Petals ── */
    .petal {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      font-size: 1rem;
      opacity: 0;
      animation: petalFall linear forwards;
    }

    @keyframes petalFall {
      0% { opacity: 0.9; transform: translateY(-20px) rotate(0deg) scale(1); }
      50% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.4); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bouquet { transition: none; }
      .petal { animation: none; display: none; }
      .bouquet-glow { animation: none; }
      .bouquet-glow-ring { animation: none; }
      .drag-hint { animation: none; }
      #ambientCanvas { display: none; }
    }

    @media (max-height: 650px) {
      .scene { height: 280px; width: 240px; }
      .stem { height: 120px; }
      .flower-head { font-size: 1.8rem; }
      .bouquet-glow { width: 200px; height: 200px; }
    }
  </style>
</head>
<body>
  <div class="bg-fade"></div>
  <canvas id="ambientCanvas"></canvas>

  <a href="lovepage.html" class="back-link">← back</a>

  <div class="flowers-page">
    <h1 class="flowers-title">A Bouquet for You</h1>
    <p class="flowers-subtitle">drag to rotate · tap a flower</p>
    <div class="drag-hint" id="dragHint">✦ drag to spin ✦</div>

    <div class="scene" id="scene">
      <div class="bouquet-glow"></div>
      <div class="bouquet-glow-ring"></div>
      <div class="bouquet" id="bouquet">
        <div class="stem"></div>
        <div class="ribbon"></div>
        <div class="leaf" style="bottom:80px;left:calc(50% - 20px);transform:rotate(-30deg) translateZ(-4px)"></div>
        <div class="leaf" style="bottom:100px;left:calc(50% + 8px);transform:rotate(30deg) scaleX(-1) translateZ(5px)"></div>
        <div class="leaf" style="bottom:55px;left:calc(50% + 5px);transform:rotate(25deg) scaleX(-1) translateZ(-6px)"></div>
        <div class="leaf" style="bottom:115px;left:calc(50% - 22px);transform:rotate(-20deg) translateZ(3px)"></div>
      </div>
    </div>

    <div class="flower-message" id="flowerMessage">
      <button class="close-msg" id="closeMsg">✕</button>
      <h3 id="flowerName"></h3>
      <p id="flowerText"></p>
    </div>
  </div>

  <script src="anniversary.js"></script>
  <script src="app.js"></script>
  <script>
  (function(){
    /* ═══ AMBIENT PARTICLES CANVAS ═══ */
    var canvas = document.getElementById("ambientCanvas");
    var ctx = canvas.getContext("2d");
    var particles = [];
    var PARTICLE_COUNT = 50;

    function resizeCanvas(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function Particle(){
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 0.5;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.speedY = -Math.random() * 0.4 - 0.1;
      this.opacity = Math.random() * 0.4 + 0.1;
      this.pulse = Math.random() * Math.PI * 2;
      this.pulseSpeed = Math.random() * 0.02 + 0.005;
      var colors = ["255,143,171","224,86,124","232,193,126","255,211,224","255,247,238"];
      this.color = colors[Math.floor(Math.random() * colors.length)];
    }

    Particle.prototype.update = function(){
      this.x += this.speedX;
      this.y += this.speedY;
      this.pulse += this.pulseSpeed;
      this.opacity = (Math.sin(this.pulse) * 0.15 + 0.25);
      if(this.y < -10) this.y = canvas.height + 10;
      if(this.x < -10) this.x = canvas.width + 10;
      if(this.x > canvas.width + 10) this.x = -10;
    };

    Particle.prototype.draw = function(){
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + this.color + "," + this.opacity + ")";
      ctx.fill();
      // glow
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + this.color + "," + (this.opacity * 0.15) + ")";
      ctx.fill();
    };

    for(var i = 0; i < PARTICLE_COUNT; i++){
      particles.push(new Particle());
    }

    function animateParticles(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function(p){
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* ═══ FLOWERS DATA ═══ */
    var flowers = [
      { emoji: "🌹", name: "Red Rose",     meaning: "I love you",              msg: "You are the love of my life. Every beat of my heart spells your name." },
      { emoji: "🌻", name: "Sunflower",    meaning: "I adore you",             msg: "You are my sunshine. Wherever you go, my eyes will follow." },
      { emoji: "🌷", name: "Tulip",        meaning: "Perfect love",            msg: "Our love is perfect, just as it is. I wouldn't change a thing." },
      { emoji: "🌸", name: "Cherry Blossom", meaning: "Beauty & grace",        msg: "You are the most beautiful thing that has ever happened to me." },
      { emoji: "🌼", name: "Daisy",        meaning: "Innocent love",           msg: "I fell in love with your innocence, your kindness, your soul." },
      { emoji: "🪷", name: "Lotus",        meaning: "Purity of heart",         msg: "Your heart is pure gold. I am lucky to be loved by you." },
      { emoji: "🌺", name: "Hibiscus",     meaning: "Delicate beauty",         msg: "You are delicate yet strong. My forever flower." },
      { emoji: "🏵️", name: "Bouquet",      meaning: "Gratitude",               msg: "This bouquet is just a fraction of my love for you." },
      { emoji: "💮", name: "White Rose",   meaning: "Pure devotion",           msg: "My love for you is pure, eternal, and unconditional." },
      { emoji: "🌸", name: "Pink Rose",    meaning: "Gentle love",             msg: "Every petal of my love is colored with your name." },
      { emoji: "🌼", name: "Calendula",    meaning: "Warmth & joy",            msg: "You bring warmth to my coldest days and joy to my quietest moments." },
      { emoji: "🌺", name: "Plumeria",     meaning: "New beginnings",          msg: "Every day with you is a beautiful new beginning." }
    ];

    var bouquet = document.getElementById("bouquet");
    var scene = document.getElementById("scene");
    var flowerMessage = document.getElementById("flowerMessage");
    var flowerName = document.getElementById("flowerName");
    var flowerText = document.getElementById("flowerText");
    var closeMsg = document.getElementById("closeMsg");
    var dragHint = document.getElementById("dragHint");

    var rotX = -10, rotY = 0;
    var autoRotY = 0;
    var isDragging = false;
    var startX = 0, startY = 0;
    var startRotX = 0, startRotY = 0;
    var autoRotate = true;
    var hintTimer = null;

    /* ═══ PLACE FLOWERS IN 3D ═══ */
    function placeFlowers(){
      bouquet.querySelectorAll(".flower-head").forEach(function(e){ e.remove(); });

      var layers = [
        { count: 4, radiusX: 78, radiusZ: 78, y: -45,  rotOffset: 0,   size: [2.0, 2.4] },
        { count: 5, radiusX: 100, radiusZ: 100, y: 8,   rotOffset: 36,  size: [2.2, 2.7] },
        { count: 3, radiusX: 55, radiusZ: 55, y: 55,    rotOffset: 60,  size: [1.7, 2.1] }
      ];

      var idx = 0;
      layers.forEach(function(layer){
        for(var i = 0; i < layer.count && idx < flowers.length; i++){
          var angle = (360 / layer.count) * i + layer.rotOffset;
          var rad = angle * Math.PI / 180;
          var x = Math.sin(rad) * layer.radiusX;
          var z = Math.cos(rad) * layer.radiusZ;
          var y = layer.y;

          var f = flowers[idx];
          var el = document.createElement("div");
          el.className = "flower-head";
          el.setAttribute("data-idx", idx);
          el.innerHTML = f.emoji + '<span class="tooltip">' + f.name + '</span>';
          el.style.cssText = "left:calc(50% + " + x + "px);top:calc(50% + " + y + "px);transform:translate(-50%,-50%) translateZ(" + z + "px)";
          var sz = layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]);
          el.style.fontSize = sz + "rem";

          el.addEventListener("click", function(e){
            e.stopPropagation();
            var fi = parseInt(this.getAttribute("data-idx"));
            showFlowerMessage(fi);
            bouquet.querySelectorAll(".flower-head").forEach(function(h){ h.classList.remove("active"); });
            this.classList.add("active");
            spawnPetals(6);
            try { navigator.vibrate(15); } catch(err){}
          });

          bouquet.appendChild(el);
          idx++;
        }
      });
    }

    /* ═══ SHOW MESSAGE ═══ */
    function showFlowerMessage(idx){
      var f = flowers[idx];
      flowerName.textContent = f.emoji + " " + f.name + " — " + f.meaning;
      flowerText.textContent = f.msg;
      flowerMessage.classList.add("show");
    }

    closeMsg.addEventListener("click", function(e){
      e.stopPropagation();
      flowerMessage.classList.remove("show");
      bouquet.querySelectorAll(".flower-head").forEach(function(h){ h.classList.remove("active"); });
    });

    scene.addEventListener("click", function(){
      flowerMessage.classList.remove("show");
      bouquet.querySelectorAll(".flower-head").forEach(function(h){ h.classList.remove("active"); });
    });

    /* ═══ DRAG TO ROTATE ═══ */
    function onPointerDown(e){
      if(e.target.closest(".flower-head") || e.target.closest(".back-link") || e.target.closest(".close-msg")) return;
      isDragging = true;
      autoRotate = false;
      startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      startY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      startRotX = rotX;
      startRotY = rotY;
      bouquet.classList.add("dragging");
      if(dragHint) dragHint.style.opacity = "0";
      clearTimeout(hintTimer);
    }

    function onPointerMove(e){
      if(!isDragging) return;
      var cx = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      var cy = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      var dx = cx - startX;
      var dy = cy - startY;
      rotY = startRotY + dx * 0.5;
      rotX = Math.max(-40, Math.min(30, startRotX - dy * 0.3));
      bouquet.style.transform = "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
    }

    function onPointerUp(){
      if(!isDragging) return;
      isDragging = false;
      bouquet.classList.remove("dragging");
      clearTimeout(hintTimer);
      hintTimer = setTimeout(function(){ autoRotate = true; }, 3000);
    }

    scene.addEventListener("mousedown", onPointerDown);
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("mouseup", onPointerUp);
    scene.addEventListener("touchstart", onPointerDown, { passive: true });
    window.addEventListener("touchmove", onPointerMove, { passive: true });
    window.addEventListener("touchend", onPointerUp);

    /* ═══ AUTO ROTATION ═══ */
    function animate(){
      if(autoRotate){
        autoRotY += 0.25;
        rotY = autoRotY;
        rotX = -10 + Math.sin(autoRotY * 0.008) * 6;
        bouquet.style.transform = "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
      }
      requestAnimationFrame(animate);
    }

    /* ═══ PETALS ═══ */
    function spawnPetals(count){
      var petals = ["🌸","🌹","🌷","🌺","💮","🏵️","✨","💗","🤍"];
      for(var i = 0; i < (count || 8); i++){
        (function(d){
          setTimeout(function(){
            var el = document.createElement("span");
            el.className = "petal";
            el.textContent = petals[Math.floor(Math.random() * petals.length)];
            el.style.left = (15 + Math.random() * 70) + "vw";
            el.style.animationDuration = (Math.random() * 3 + 3) + "s";
            document.body.appendChild(el);
            setTimeout(function(){ el.remove(); }, 6000);
          }, d);
        })(i * 150);
      }
    }

    /* ═══ INIT ═══ */
    placeFlowers();
    animate();
    setTimeout(function(){ spawnPetals(12); }, 400);
    setTimeout(function(){ if(dragHint) dragHint.style.opacity = "0"; }, 5000);
  })();
  </script>
</body>
</html>
