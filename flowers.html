<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Flowers for You</title>
  <meta name="theme-color" content="#1a0f14">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <style>
    body {
      background: #0e0810;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--cream);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .bg-fade {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(900px 500px at 50% 40%, rgba(224,86,124,0.12), transparent 60%),
        radial-gradient(600px 400px at 30% 70%, rgba(180,60,100,0.08), transparent 50%),
        radial-gradient(600px 400px at 70% 30%, rgba(232,193,126,0.06), transparent 50%),
        linear-gradient(180deg, #140c12, #0e0810);
    }

    /* ── Ambient canvas ── */
    #ambientCanvas {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
    }

    .flowers-page {
      position: relative; z-index: 2;
      text-align: center;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 1rem;
    }

    .flowers-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 400;
      background: linear-gradient(90deg, #ffd3e0, var(--gold), #fff, var(--gold), #ffd3e0);
      background-size: 250% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 5s linear infinite;
      margin-bottom: 0.2rem;
      z-index: 5;
      transition: transform 0.1s linear;
    }

    .flowers-subtitle {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 0.9rem;
      font-style: italic;
      color: rgba(255,247,238,0.45);
      margin-bottom: 0.6rem;
      z-index: 5;
      transition: transform 0.1s linear;
    }

    .drag-hint {
      font-size: 0.65rem;
      color: rgba(255,247,238,0.3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      z-index: 5;
      animation: hintPulse 2.5s ease-in-out infinite;
    }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    /* ── 3D Scene ── */
    .scene {
      width: 300px;
      height: 360px;
      perspective: 900px;
      perspective-origin: 50% 45%;
      position: relative;
      z-index: 5;
      margin: 0 auto;
      overflow: hidden;
    }

    @keyframes shimmer { to { background-position: 250% center; } }

    /* ── Bouquet glow (behind everything) ── */
    .bouquet-glow {
      position: absolute;
      top: 30%;
      left: 50%;
      width: 260px;
      height: 260px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(224,86,124,0.15) 0%, rgba(224,86,124,0.05) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: glowPulse 4s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }

    /* ── Second glow ring ── */
    .bouquet-glow-ring {
      position: absolute;
      top: 30%;
      left: 50%;
      width: 300px;
      height: 300px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255,143,171,0.06);
      pointer-events: none;
      animation: ringRotate 8s linear infinite;
      z-index: 0;
    }

    .bouquet-glow-ring::before {
      content: '';
      position: absolute;
      top: -2px; left: 50%;
      width: 4px; height: 4px;
      background: rgba(255,143,171,0.4);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255,143,171,0.6);
    }

    @keyframes ringRotate {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .bouquet {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-10deg) rotateY(0deg);
      transition: transform 0.05s linear;
      z-index: 1;
    }

    .bouquet.dragging {
      transition: none;
    }

    .scene.dragging .bouquet {
      filter: drop-shadow(0 0 30px rgba(224,86,124,0.2));
    }

    /* ── Stem (3D cylindrical) ── */
    .stem {
      position: absolute;
      bottom: 20px;
      left: 50%;
      width: 6px;
      height: 160px;
      background: linear-gradient(to right, #1a3a10, #3a8a28 30%, #4aaa38 50%, #3a8a28 70%, #1a3a10);
      transform: translateX(-50%);
      border-radius: 3px;
      box-shadow:
        2px 0 10px rgba(0,0,0,0.4),
        -1px 0 6px rgba(0,0,0,0.2),
        inset 1px 0 2px rgba(255,255,255,0.1);
    }

    .stem::before {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 35px;
      height: 22px;
      background: linear-gradient(to top, rgba(30,64,18,0), #1e4012);
      border-radius: 0 0 18px 18px;
    }

    /* ── Ribbon ── */
    .ribbon {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateZ(6px);
      width: 44px;
      height: 14px;
      background: linear-gradient(135deg, #c94070, #e0567c, #ff8fab);
      border-radius: 7px;
      box-shadow: 0 3px 12px rgba(224,86,124,0.5), 0 0 20px rgba(224,86,124,0.15);
    }

    .ribbon::before, .ribbon::after {
      content: '';
      position: absolute;
      top: 100%;
      width: 9px;
      height: 28px;
      border-radius: 0 0 5px 5px;
    }

    .ribbon::before {
      left: 7px;
      background: linear-gradient(to bottom, #c94070, rgba(201,64,112,0.2));
      transform: rotate(-10deg);
    }

    .ribbon::after {
      right: 7px;
      background: linear-gradient(to bottom, #ff8fab, rgba(255,143,171,0.2));
      transform: rotate(10deg);
    }

    /* ── Flower heads ── */
    .flower-head {
      position: absolute;
      cursor: pointer;
      z-index: 2;
      width: 60px;
      height: 60px;
      transition: filter 0.3s ease, transform 0.3s var(--spring);
      transform-style: preserve-3d;
    }

    /* ── CSS 3D Flower ── */
    .css-flower {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* ── Petal ── */
    .css-flower .petal {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: 50% 100%;
      border-radius: 50% 50% 4px 4px;
      backface-visibility: hidden;
    }

    .css-flower .petal::after {
      content: '';
      position: absolute;
      top: 8%;
      left: 12%;
      width: 45%;
      height: 55%;
      background: linear-gradient(160deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 40%, transparent 100%);
      border-radius: 50%;
    }

    /* ── Pistil ── */
    .css-flower .pistil {
      position: absolute;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      box-shadow:
        inset 0 -2px 4px rgba(0,0,0,0.35),
        inset 0 2px 3px rgba(255,255,255,0.3),
        0 0 6px rgba(0,0,0,0.15);
    }

    .css-flower .pistil::after {
      content: '';
      position: absolute;
      top: 12%;
      left: 18%;
      width: 35%;
      height: 35%;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
    }

    /* ── Rose ── */
    .css-flower.type-rose .petal {
      background: linear-gradient(to top, #b71c1c, #e53935, #ef5350);
    }
    .css-flower.type-rose .pistil {
      background: radial-gradient(circle at 40% 35%, #ffb300, #ff8f00);
    }

    /* ── Sunflower ── */
    .css-flower.type-sunflower .petal {
      background: linear-gradient(to top, #f57f17, #fdd835, #fff176);
    }
    .css-flower.type-sunflower .pistil {
      background: radial-gradient(circle at 40% 35%, #5d4037, #3e2723);
      width: 38%;
      height: 38%;
    }

    /* ── Tulip ── */
    .css-flower.type-tulip .petal {
      background: linear-gradient(to top, #ad1457, #e91e63, #f48fb1);
      border-radius: 40% 40% 4px 4px;
    }
    .css-flower.type-tulip .pistil {
      background: radial-gradient(circle at 40% 35%, #fff176, #ffee58);
      width: 22%;
      height: 22%;
    }

    /* ── Cherry Blossom ── */
    .css-flower.type-cherry .petal {
      background: linear-gradient(to top, #f48fb1, #fce4ec, #fff);
    }
    .css-flower.type-cherry .pistil {
      background: radial-gradient(circle at 40% 35%, #e91e63, #c2185b);
      width: 22%;
      height: 22%;
    }

    /* ── Daisy ── */
    .css-flower.type-daisy .petal {
      background: linear-gradient(to top, #e0e0e0, #fafafa, #fff);
    }
    .css-flower.type-daisy .pistil {
      background: radial-gradient(circle at 40% 35%, #f9a825, #f57f17);
      width: 28%;
      height: 28%;
    }

    /* ── Lotus ── */
    .css-flower.type-lotus .petal {
      background: linear-gradient(to top, #f48fb1, #fce4ec, #fff);
      border-radius: 45% 45% 4px 4px;
    }
    .css-flower.type-lotus .pistil {
      background: radial-gradient(circle at 40% 35%, #aed581, #7cb342);
      width: 24%;
      height: 24%;
    }

    /* ── Hibiscus ── */
    .css-flower.type-hibiscus .petal {
      background: linear-gradient(to top, #c2185b, #ec407a, #f48fb1);
    }
    .css-flower.type-hibiscus .pistil {
      background: radial-gradient(circle at 40% 35%, #fff176, #fdd835);
      width: 24%;
      height: 24%;
    }

    /* ── Bouquet ── */
    .css-flower.type-bouquet .petal {
      background: linear-gradient(to top, #ab47bc, #ce93d8, #e1bee7);
    }
    .css-flower.type-bouquet .pistil {
      background: radial-gradient(circle at 40% 35%, #ff8a65, #ff7043);
    }

    /* ── White Rose ── */
    .css-flower.type-white .petal {
      background: linear-gradient(to top, #bdbdbd, #e0e0e0, #fff);
    }
    .css-flower.type-white .pistil {
      background: radial-gradient(circle at 40% 35%, #aed581, #8bc34a);
    }

    /* ── Pink Rose ── */
    .css-flower.type-pink .petal {
      background: linear-gradient(to top, #ec407a, #f48fb1, #fce4ec);
    }
    .css-flower.type-pink .pistil {
      background: radial-gradient(circle at 40% 35%, #fff176, #ffee58);
      width: 24%;
      height: 24%;
    }

    /* ── Calendula ── */
    .css-flower.type-calendula .petal {
      background: linear-gradient(to top, #e65100, #ff9800, #ffcc02);
    }
    .css-flower.type-calendula .pistil {
      background: radial-gradient(circle at 40% 35%, #5d4037, #4e342e);
      width: 30%;
      height: 30%;
    }

    /* ── Plumeria ── */
    .css-flower.type-plumeria .petal {
      background: linear-gradient(to top, #fff9c4, #fff, #fff);
      border-radius: 45% 45% 4px 4px;
    }
    .css-flower.type-plumeria .pistil {
      background: radial-gradient(circle at 40% 35%, #f9a825, #f57f17);
    }

    /* Glow aura */
    .flower-head::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,143,171,0.12), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .flower-head:hover { z-index: 10; }
    .flower-head:hover::after { opacity: 1; }
    .flower-head.active { z-index: 10; }
    .flower-head.active::after { opacity: 1; background: radial-gradient(circle, rgba(255,143,171,0.2), transparent 70%); }

    .flower-head .tooltip {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%) translateZ(30px);
      background: rgba(14,8,16,0.92);
      border: 1px solid rgba(255,143,171,0.35);
      border-radius: 10px;
      padding: 0.35rem 0.7rem;
      white-space: nowrap;
      font-size: 0.72rem;
      color: var(--cream);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s var(--spring);
      font-family: "Cormorant Garamond", Georgia, serif;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.5), 0 0 1px rgba(255,143,171,0.3);
      letter-spacing: 0.02em;
    }

    .flower-head:hover .tooltip,
    .flower-head.active .tooltip {
      opacity: 1;
    }

    /* ── Leaves ── */
    .leaf {
      position: absolute;
      width: 22px;
      height: 34px;
      background: linear-gradient(135deg, #2a6a18, #3a8a28);
      border-radius: 50% 0 50% 0;
      transform-origin: bottom center;
      transform-style: preserve-3d;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
    }

    .leaf::after {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      width: 1px;
      height: 50%;
      background: rgba(255,255,255,0.1);
      transform: translateX(-50%) rotate(5deg);
    }

    /* ── Flower message panel ── */
    .flower-message {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(14,8,16,0.98) 60%, rgba(14,8,16,0.9) 80%, transparent);
      padding: 2rem 1.5rem 2.5rem;
      z-index: 20;
      transform: translateY(100%);
      transition: transform 0.5s var(--spring);
    }

    .flower-message.show {
      transform: translateY(0);
    }

    .flower-message h3 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.2rem;
      color: var(--gold);
      margin-bottom: 0.4rem;
      text-shadow: 0 0 20px rgba(232,193,126,0.2);
    }

    .flower-message p {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1rem;
      font-style: italic;
      color: rgba(255,247,238,0.7);
      line-height: 1.6;
    }

    .flower-message .close-msg {
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      background: none;
      border: none;
      color: rgba(255,247,238,0.35);
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .flower-message .close-msg:hover {
      color: rgba(255,247,238,0.7);
    }

    /* ── Back link ── */
    .back-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--cream);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      border: 1px solid rgba(255,143,171,0.25);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      transition: all 0.3s ease;
      background: rgba(14,8,16,0.5);
      backdrop-filter: blur(10px);
    }

    .back-link:hover {
      background: rgba(224,86,124,0.15);
      border-color: rgba(255,143,171,0.5);
    }

    @media (prefers-reduced-motion: reduce) {
      .bouquet { transition: none; }
      .bouquet-glow { animation: none; }
      .bouquet-glow-ring { animation: none; }
      .drag-hint { animation: none; }
      #ambientCanvas { display: none; }
    }

    @media (max-height: 650px) {
      .scene { height: 280px; width: 240px; }
      .stem { height: 120px; }
      .flower-head { width: 48px; height: 48px; }
      .bouquet-glow { width: 200px; height: 200px; }
    }
  </style>
</head>
<body>
  <div class="bg-fade"></div>
  <canvas id="ambientCanvas"></canvas>

  <a href="lovepage.html" class="back-link">← back</a>

  <div class="flowers-page">
    <h1 class="flowers-title">A Bouquet for You</h1>
    <p class="flowers-subtitle">drag to rotate · tap a flower</p>
    <div class="drag-hint" id="dragHint">✦ drag to spin ✦</div>

    <div class="scene" id="scene">
      <div class="bouquet-glow"></div>
      <div class="bouquet-glow-ring"></div>
      <div class="bouquet" id="bouquet">
        <div class="stem"></div>
        <div class="ribbon"></div>
        <div class="leaf" style="bottom:80px;left:calc(50% - 20px);transform:rotate(-30deg) translateZ(-4px)"></div>
        <div class="leaf" style="bottom:100px;left:calc(50% + 8px);transform:rotate(30deg) scaleX(-1) translateZ(5px)"></div>
        <div class="leaf" style="bottom:55px;left:calc(50% + 5px);transform:rotate(25deg) scaleX(-1) translateZ(-6px)"></div>
        <div class="leaf" style="bottom:115px;left:calc(50% - 22px);transform:rotate(-20deg) translateZ(3px)"></div>
      </div>
    </div>

    <div class="flower-message" id="flowerMessage">
      <button class="close-msg" id="closeMsg">✕</button>
      <h3 id="flowerName"></h3>
      <p id="flowerText"></p>
    </div>
  </div>

  <script src="anniversary.js"></script>
  <script src="app.js"></script>
  <script>
  (function(){
    /* ═══ AMBIENT PARTICLES CANVAS ═══ */
    var canvas = document.getElementById("ambientCanvas");
    var ctx = canvas.getContext("2d");
    var particles = [];
    var PARTICLE_COUNT = 50;

    function resizeCanvas(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function Particle(){
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 0.5;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.speedY = -Math.random() * 0.4 - 0.1;
      this.pulse = Math.random() * Math.PI * 2;
      this.pulseSpeed = Math.random() * 0.02 + 0.005;
      this.opacity = Math.sin(this.pulse) * 0.15 + 0.25;
      var colors = ["255,143,171","224,86,124","232,193,126","255,211,224","255,247,238"];
      this.color = colors[Math.floor(Math.random() * colors.length)];
    }

    Particle.prototype.update = function(){
      this.x += this.speedX;
      this.y += this.speedY;
      this.pulse += this.pulseSpeed;
      this.opacity = (Math.sin(this.pulse) * 0.15 + 0.25);
      if(this.y < -10) this.y = canvas.height + 10;
      if(this.x < -10) this.x = canvas.width + 10;
      if(this.x > canvas.width + 10) this.x = -10;
    };

    Particle.prototype.draw = function(){
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + this.color + "," + this.opacity + ")";
      ctx.fill();
      // glow
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + this.color + "," + (this.opacity * 0.15) + ")";
      ctx.fill();
    };

    for(var i = 0; i < PARTICLE_COUNT; i++){
      particles.push(new Particle());
    }

    function animateParticles(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function(p){
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* ═══ FLOWERS DATA ═══ */
    var flowers = [
      { type: "rose",       petals: 8, name: "Red Rose",        meaning: "I love you",              msg: "You are the love of my life. Every beat of my heart spells your name." },
      { type: "sunflower",  petals: 12, name: "Sunflower",       meaning: "I adore you",             msg: "You are my sunshine. Wherever you go, my eyes will follow." },
      { type: "tulip",      petals: 6, name: "Tulip",           meaning: "Perfect love",            msg: "Our love is perfect, just as it is. I wouldn't change a thing." },
      { type: "cherry",     petals: 5, name: "Cherry Blossom",  meaning: "Beauty & grace",          msg: "You are the most beautiful thing that has ever happened to me." },
      { type: "daisy",      petals: 10, name: "Daisy",           meaning: "Innocent love",           msg: "I fell in love with your innocence, your kindness, your soul." },
      { type: "lotus",      petals: 8, name: "Lotus",           meaning: "Purity of heart",         msg: "Your heart is pure gold. I am lucky to be loved by you." },
      { type: "hibiscus",   petals: 5, name: "Hibiscus",        meaning: "Delicate beauty",         msg: "You are delicate yet strong. My forever flower." },
      { type: "bouquet",    petals: 7, name: "Bouquet",         meaning: "Gratitude",               msg: "This bouquet is just a fraction of my love for you." },
      { type: "white",      petals: 8, name: "White Rose",      meaning: "Pure devotion",           msg: "My love for you is pure, eternal, and unconditional." },
      { type: "pink",       petals: 8, name: "Pink Rose",       meaning: "Gentle love",             msg: "Every petal of my love is colored with your name." },
      { type: "calendula",  petals: 12, name: "Calendula",       meaning: "Warmth & joy",            msg: "You bring warmth to my coldest days and joy to my quietest moments." },
      { type: "plumeria",   petals: 5, name: "Plumeria",        meaning: "New beginnings",          msg: "Every day with you is a beautiful new beginning." }
    ];

    /* ═══ BUILD CSS 3D FLOWER ═══ */
    function buildCSSFlower(type, petalCount, size){
      var wrapper = document.createElement("div");
      wrapper.className = "css-flower type-" + type;
      wrapper.style.width = size + "px";
      wrapper.style.height = size + "px";

      var petalW = Math.round(size * 0.3);
      var petalH = Math.round(size * 0.44);

      for(var i = 0; i < petalCount; i++){
        var angle = (360 / petalCount) * i;
        var petal = document.createElement("div");
        petal.className = "petal";
        petal.style.width = petalW + "px";
        petal.style.height = petalH + "px";
        petal.style.marginLeft = Math.round(-petalW / 2) + "px";
        petal.style.transform = "rotate(" + angle + "deg)";
        wrapper.appendChild(petal);
      }

      var pistil = document.createElement("div");
      pistil.className = "pistil";
      wrapper.appendChild(pistil);

      return wrapper;
    }

    var bouquet = document.getElementById("bouquet");
    var scene = document.getElementById("scene");
    var flowerMessage = document.getElementById("flowerMessage");
    var flowerName = document.getElementById("flowerName");
    var flowerText = document.getElementById("flowerText");
    var closeMsg = document.getElementById("closeMsg");
    var dragHint = document.getElementById("dragHint");
    var titleEl = document.querySelector(".flowers-title");
    var subEl = document.querySelector(".flowers-subtitle");

    var rotX = -10, rotY = 0;
    var autoRotY = 0;
    var isDragging = false;
    var startX = 0, startY = 0;
    var startRotX = 0, startRotY = 0;
    var autoRotate = true;
    var hintTimer = null;

    /* ═══ PLACE FLOWERS IN 3D ═══ */
    var flowerEls = [];

    function placeFlowers(){
      bouquet.querySelectorAll(".flower-head").forEach(function(e){ e.remove(); });
      flowerEls = [];

      var layers = [
        { count: 4, radiusX: 78, radiusZ: 78, y: -45,  rotOffset: 0,   size: [2.0, 2.4] },
        { count: 5, radiusX: 100, radiusZ: 100, y: 8,   rotOffset: 36,  size: [2.2, 2.7] },
        { count: 3, radiusX: 55, radiusZ: 55, y: 55,    rotOffset: 60,  size: [1.7, 2.1] }
      ];

      var idx = 0;
      layers.forEach(function(layer){
        for(var i = 0; i < layer.count && idx < flowers.length; i++){
          var angle = (360 / layer.count) * i + layer.rotOffset;
          var rad = angle * Math.PI / 180;
          var x = Math.sin(rad) * layer.radiusX;
          var z = Math.cos(rad) * layer.radiusZ;
          var y = layer.y;

          var f = flowers[idx];
          var sz = layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]);
          var el = document.createElement("div");
          el.className = "flower-head";
          el.setAttribute("data-idx", idx);
          el.setAttribute("data-base-z", z);

          // Build CSS 3D flower
          var flowerSize = sz * 28;
          var cssFlower = buildCSSFlower(f.type, f.petals, flowerSize);
          el.appendChild(cssFlower);

          // Tooltip
          var tip = document.createElement("span");
          tip.className = "tooltip";
          tip.textContent = f.name;
          el.appendChild(tip);

          el.style.cssText = "left:calc(50% + " + x + "px);top:calc(50% + " + y + "px);transform:translate(-50%,-50%) translateZ(" + z + "px);--tz:" + z + "px";

          el.addEventListener("click", function(e){
            e.stopPropagation();
            var fi = parseInt(this.getAttribute("data-idx"));
            showFlowerMessage(fi);
            bouquet.querySelectorAll(".flower-head").forEach(function(h){ h.classList.remove("active"); });
            this.classList.add("active");
            spawnPetals(6);
            try { navigator.vibrate(15); } catch(err){}
          });

          bouquet.appendChild(el);
          flowerEls.push({ el: el, baseZ: z, baseX: x, baseY: y });
          idx++;
        }
      });
    }

    /* ═══ UPDATE 3D EFFECTS EVERY FRAME ═══ */
    function update3D(){
      var radY = rotY * Math.PI / 180;
      var radX = rotX * Math.PI / 180;

      flowerEls.forEach(function(f){
        // Rotate the base position around Y axis
        var rotatedZ = f.baseX * Math.sin(radY) + f.baseZ * Math.cos(radY);
        // Depth-based z-index (front = higher)
        var zIndex = Math.round(rotatedZ + 200);
        f.el.style.zIndex = zIndex;

        // Depth fog: flowers further from camera get dimmer
        var depthFactor = (rotatedZ + 110) / 220; // 0 = farthest, 1 = closest
        depthFactor = Math.max(0.4, Math.min(1, depthFactor));
        var brightness = 0.6 + depthFactor * 0.4;
        var sat = 0.7 + depthFactor * 0.3;
        if(!f.el.classList.contains("active") && !f.el.matches(":hover")){
          f.el.style.filter = "brightness(" + brightness + ") saturate(" + sat + ")";
        }
      });

      // Dynamic lighting: shift sphere gradient based on rotation
      var lightX = 35 + Math.sin(radY) * 20;
      var lightY = 30 + Math.sin(radX) * 15;
      var lightStr = "circle at " + lightX + "% " + lightY + "%";
      bouquet.querySelectorAll(".flower-head").forEach(function(el){
        el.style.background = "radial-gradient(" + lightStr + ", rgba(255,200,210,0.2), rgba(224,86,124,0.08) 50%, rgba(18,10,16,0.3) 100%)";
      });

      // Parallax: title moves slower, subtitle even slower
      var titleShift = Math.sin(radY) * 8;
      var subShift = Math.sin(radY) * 4;
      if(titleEl) titleEl.style.transform = "translateX(" + titleShift + "px)";
      if(subEl) subEl.style.transform = "translateX(" + subShift + "px)";
    }

    /* ═══ SHOW MESSAGE ═══ */
    function showFlowerMessage(idx){
      var f = flowers[idx];
      flowerName.textContent = f.name + " — " + f.meaning;
      flowerText.textContent = f.msg;
      flowerMessage.classList.add("show");
    }

    closeMsg.addEventListener("click", function(e){
      e.stopPropagation();
      flowerMessage.classList.remove("show");
      bouquet.querySelectorAll(".flower-head").forEach(function(h){ h.classList.remove("active"); });
    });

    scene.addEventListener("click", function(){
      flowerMessage.classList.remove("show");
      bouquet.querySelectorAll(".flower-head").forEach(function(h){ h.classList.remove("active"); });
    });

    /* ═══ DRAG TO ROTATE ═══ */
    function onPointerDown(e){
      if(e.target.closest(".flower-head") || e.target.closest(".back-link") || e.target.closest(".close-msg")) return;
      isDragging = true;
      autoRotate = false;
      startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      startY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      startRotX = rotX;
      startRotY = rotY;
      bouquet.classList.add("dragging");
      scene.classList.add("dragging");
      if(dragHint) dragHint.style.opacity = "0";
      clearTimeout(hintTimer);
    }

    function onPointerMove(e){
      if(!isDragging) return;
      var cx = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      var cy = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      var dx = cx - startX;
      var dy = cy - startY;
      rotY = startRotY + dx * 0.5;
      rotX = Math.max(-40, Math.min(30, startRotX - dy * 0.3));
      bouquet.style.transform = "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
    }

    function onPointerUp(){
      if(!isDragging) return;
      isDragging = false;
      bouquet.classList.remove("dragging");
      scene.classList.remove("dragging");
      clearTimeout(hintTimer);
      hintTimer = setTimeout(function(){ autoRotate = true; }, 3000);
    }

    scene.addEventListener("mousedown", onPointerDown);
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("mouseup", onPointerUp);
    scene.addEventListener("touchstart", onPointerDown, { passive: true });
    window.addEventListener("touchmove", onPointerMove, { passive: true });
    window.addEventListener("touchend", onPointerUp);

    /* ═══ AUTO ROTATION ═══ */
    function animate(){
      if(autoRotate){
        autoRotY += 0.25;
        rotY = autoRotY;
        rotX = -10 + Math.sin(autoRotY * 0.008) * 6;
        bouquet.style.transform = "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
      }
      update3D();
      requestAnimationFrame(animate);
    }

    /* ═══ PETALS ═══ */
    function spawnPetals(count){
      var petals = ["🌸","🌹","🌷","🌺","💮","🏵️","✨","💗","🤍"];
      for(var i = 0; i < (count || 8); i++){
        (function(d){
          setTimeout(function(){
            var el = document.createElement("span");
            el.className = "falling-petal";
            el.textContent = petals[Math.floor(Math.random() * petals.length)];
            el.style.left = (15 + Math.random() * 70) + "vw";
            el.style.animationDuration = (Math.random() * 3 + 3) + "s";
            document.body.appendChild(el);
            setTimeout(function(){ el.remove(); }, 6000);
          }, d);
        })(i * 150);
      }
    }

    /* ═══ INIT ═══ */
    placeFlowers();
    animate();
    setTimeout(function(){ spawnPetals(12); }, 400);
    setTimeout(function(){ if(dragHint) dragHint.style.opacity = "0"; }, 5000);
  })();
  </script>
</body>
</html>
