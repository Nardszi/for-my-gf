<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Time Capsule — for us</title>
<meta name="theme-color" content="#1a0f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Time Capsule — our secret date">
<meta property="og:description" content="A letter I wrote for a day I can't wait to give you.">
<meta property="og:image" content="og-preview.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--rose:#ff8fab;--rose-deep:#e0567c;--cream:#fff7ee;--gold:#e8c17e;--spring:cubic-bezier(0.34,1.56,0.64,1)}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:#120a10;color:var(--cream);min-height:100vh;overflow-x:hidden}
.bg-fade{position:fixed;inset:0;z-index:0;background:radial-gradient(1200px 600px at 50% -10%,rgba(224,86,124,0.28),transparent 60%),radial-gradient(900px 500px at 100% 110%,rgba(232,193,126,0.12),transparent 55%),linear-gradient(180deg,#1a0f14,#120a10)}
.page{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:0 1.2rem 3.5rem}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem 0}
.topbar a{color:var(--cream);text-decoration:none;font-size:0.82rem;letter-spacing:0.06em;border:1px solid rgba(255,143,171,0.35);padding:0.45rem 0.9rem;border-radius:999px;transition:background 0.3s ease}
.topbar a:hover{background:rgba(224,86,124,0.25)}
.topbar .brand{font-family:Georgia,serif;letter-spacing:0.14em;color:var(--gold);font-size:0.95rem}
header{text-align:center;padding:1.4rem 0 1rem}
header h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(2rem,8vw,3rem);background:linear-gradient(90deg,#ffd3e0,var(--gold),#fff,var(--gold),#ffd3e0);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
header p{font-size:0.86rem;font-style:italic;color:rgba(255,247,238,0.62);margin-top:0.4rem}
.counter{display:inline-block;margin-top:0.7rem;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--rose);border:1px solid rgba(255,143,171,0.4);padding:0.4rem 1rem;border-radius:999px}
.locked{text-align:center;padding:3rem 1rem}
.locked .big{font-size:3rem;margin-bottom:0.6rem}
.locked p{font-size:0.86rem;font-style:italic;color:rgba(255,247,238,0.4)}

/* 3D Chest */
.chest-scene{perspective:600px;display:inline-block;margin:0 auto 1.5rem;width:120px;height:100px}
.chest{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(-5deg) rotateY(-10deg);animation:chestFloat 3s ease-in-out infinite}
@keyframes chestFloat{0%,100%{transform:rotateX(-5deg) rotateY(-10deg) translateY(0)}50%{transform:rotateX(-5deg) rotateY(-10deg) translateY(-6px)}}
.chest-body{position:absolute;bottom:0;width:100%;height:65%;background:linear-gradient(135deg,#8a5020,#6a3818);border-radius:6px;border:2px solid rgba(232,193,126,0.5);box-shadow:0 8px 24px rgba(0,0,0,0.5),inset 0 0 15px rgba(0,0,0,0.3);transform:translateZ(10px)}
.chest-body::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:18px;background:radial-gradient(circle at 40% 40%,#ffd700,#b8860b);border-radius:4px;border:1px solid rgba(255,215,0,0.6);box-shadow:0 2px 8px rgba(255,215,0,0.4)}
.chest-lid{position:absolute;top:0;width:100%;height:40%;background:linear-gradient(135deg,#9a6030,#7a4820);border-radius:6px 6px 0 0;border:2px solid rgba(232,193,126,0.5);border-bottom:none;transform-origin:top center;transform:rotateX(0deg);transition:transform 0.8s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 -2px 12px rgba(0,0,0,0.3)}
.chest.open .chest-lid{transform:rotateX(-110deg)}
.chest-shake{animation:chestShake 0.5s ease-in-out infinite}
@keyframes chestShake{0%,100%{transform:rotateX(-5deg) rotateY(-10deg) rotateZ(0)}25%{transform:rotateX(-5deg) rotateY(-10deg) rotateZ(-2deg)}75%{transform:rotateX(-5deg) rotateY(-10deg) rotateZ(2deg)}}
.chest-glow{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:80px;height:40px;background:radial-gradient(ellipse,rgba(255,215,0,0.3),transparent);border-radius:50%;filter:blur(8px);opacity:0;transition:opacity 0.5s}
.chest.open .chest-glow{opacity:1}
.countdown{display:flex;justify-content:center;gap:1rem;margin:2rem 0}
.countdown .unit{text-align:center}
.countdown .num{font-family:Georgia,serif;font-size:2.2rem;font-weight:500;color:var(--gold)}
.countdown .lbl{font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,247,238,0.5)}
.letter{max-width:540px;font-family:Georgia,serif;font-size:1.05rem;line-height:1.9;color:var(--cream);text-shadow:0 1px 10px rgba(0,0,0,0.5);white-space:pre-wrap}
.letter .caret{display:inline-block;width:2px;height:1.1em;background:var(--rose);vertical-align:-0.15em;animation:caretBlink 0.8s steps(1) infinite}
.signature{margin-top:1.5rem;font-size:0.84rem;font-style:italic;color:var(--gold)}
.unlocked{opacity:0;transform:translateY(20px);transition:opacity 0.8s ease,transform 0.8s var(--spring)}
.unlocked.show{opacity:1;transform:translateY(0)}
@keyframes shimmer{to{background-position:250% center}}
@keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.fade-up{opacity:0;animation:fadeUp 1s var(--spring) forwards}
.d1{animation-delay:0.3s}.d2{animation-delay:0.55s}.d3{animation-delay:0.8s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}
</style>
</head>
<body>
<div class="bg-fade" aria-hidden="true"></div>
<div class="page">
<div class="topbar">
<span class="brand">TIME CAPSULE</span>
<a href="lovepage.html">&#8592; back</a>
</div>
<header>
<h1>For a Future Us</h1>
<p>a letter I wrote for a day I can't wait to give you</p>
<div class="counter" id="statusCounter">locked</div>
</header>
<div class="locked" id="lockedView">
<div class="chest-scene" id="chestScene">
  <div class="chest" id="chest3d">
    <div class="chest-lid"></div>
    <div class="chest-body"></div>
    <div class="chest-glow"></div>
  </div>
</div>
<p>this capsule opens on <strong id="unlockDate"></strong></p>
<div class="countdown" id="countdown">
<div class="unit"><div class="num" id="cdDays">0</div><div class="lbl">days</div></div>
<div class="unit"><div class="num" id="cdHours">0</div><div class="lbl">hrs</div></div>
<div class="unit"><div class="num" id="cdMins">0</div><div class="lbl">min</div></div>
<div class="unit"><div class="num" id="cdSecs">0</div><div class="lbl">sec</div></div>
</div>
</div>
<div class="unlocked" id="unlockedView">
<div class="letter" id="letterBody"></div>
<p class="signature">&mdash; always, Nard</p>
</div>
</div>
<script>
var UNLOCK_DATE=new Date('2026-09-10T00:00:00');
var unlockDateEl=document.getElementById('unlockDate');
var statusCounter=document.getElementById('statusCounter');
var lockedView=document.getElementById('lockedView');
var unlockedView=document.getElementById('unlockedView');
var letterBody=document.getElementById('letterBody');
unlockDateEl.textContent=UNLOCK_DATE.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
var letterText='My love,\n\nThis is a letter I wrote on a quiet day, not knowing when you would read it. I put it in this capsule because some words are too big to say out loud, and some feelings need a moment to land.\n\nI want you to know that every day with you is a page I never want to end. The way you laugh, the way you look at me when you think I\'m not watching, the way your hand finds mine without asking \u2014 these are the things I carry with me everywhere.\n\nWhen you open this, I hope you\'re smiling. I hope you\'re wrapped in a blanket or sitting in a park or standing somewhere beautiful. I hope you feel exactly how much I love you.\n\nThis capsule holds more than words. It holds every moment I\'ve ever imagined with you \u2014 the quiet mornings, the loud laughs, the trips we haven\'t taken yet, the home we\'re building, the future we\'re writing together.\n\nHappy anniversary, my love. Here\'s to all the ones still to come.\n\nAlways yours,\nNard';
var chest3d=document.getElementById('chest3d');
var chestShaking=false;
function updateCountdown(){
var now=new Date();
var diff=UNLOCK_DATE-now;
if(diff<=0){
if(chest3d){
  chest3d.classList.add('open');
  chest3d.classList.remove('chest-shake');
}
setTimeout(function(){
lockedView.style.display='none';
unlockedView.classList.add('show');
statusCounter.textContent='opened';
typeLetter();
},900);
return;
}
var d=Math.floor(diff/86400000);
var h=Math.floor((diff%86400000)/3600000);
var m=Math.floor((diff%3600000)/60000);
var s=Math.floor((diff%60000)/1000);
document.getElementById('cdDays').textContent=d;
document.getElementById('cdHours').textContent=h;
document.getElementById('cdMins').textContent=m;
document.getElementById('cdSecs').textContent=s;
/* shake chest on last 10 seconds */
if(d===0&&h===0&&m===0&&s<=10&&chest3d&&!chestShaking){
  chestShaking=true;
  chest3d.classList.add('chest-shake');
}
}
function typeLetter(){
if(letterBody.getAttribute('data-typed'))return;
letterBody.setAttribute('data-typed','1');
var i=0;
letterBody.innerHTML='';
var cursor=document.createElement('span');
cursor.className='caret';
var iv=setInterval(function(){
i++;
letterBody.textContent=letterText.slice(0,i);
letterBody.appendChild(cursor);
if(i>=letterText.length){
clearInterval(iv);
setTimeout(function(){try{cursor.remove()}catch(e){}},1800);
}
},20);
}
updateCountdown();
setInterval(updateCountdown,1000);
window.scrollTo(0,0);
window.addEventListener('pageshow',function(){window.scrollTo(0,0)});
</script>
<script src="anniversary.js"></script>
<script src="app.js"></script>
</body>
</html>
