<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chikoy's Chicken House</title>
<meta name="theme-color" content="#2d1810">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --wood:#8B5E3C;--wood-dark:#5C3D2E;--wood-light:#A67C52;
    --green:#4a7c59;--green-dark:#2d5a3a;--sky:#87CEEB;--sky-top:#4A90D9;
    --dirt:#6B4423;--rose:#ff8fab;--gold:#e8c17e;--cream:#fff7ee;
    --spring:cubic-bezier(0.34,1.56,0.64,1);
  }
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Quicksand",system-ui,sans-serif;
    background:#1a0f08;color:var(--cream);
    user-select:none;-webkit-user-select:none;
  }

  /* ===== GAME ARENA (FULL SCREEN) ===== */
  .arena{
    position:relative;width:100%;height:100vh;height:100dvh;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky) 30%,#b8e6b8 60%,var(--green) 100%);
    overflow:hidden;
  }

  /* ===== PHOTO FRAME (INSIDE ARENA) ===== */
  .photo-frame{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:min(92vw,420px);
    z-index:30;
    border-radius:14px;overflow:hidden;
    box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 0 3px rgba(139,94,60,0.5);
    background:var(--wood-dark);
    cursor:pointer;
    transition:transform 0.3s var(--spring),box-shadow 0.3s ease;
  }
  .photo-frame:hover{transform:translateX(-50%) scale(1.02);box-shadow:0 12px 40px rgba(0,0,0,0.5),0 0 0 3px var(--gold)}
  .photo-frame img{
    width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
  }
  .photo-label{
    padding:0.5rem 0.8rem;text-align:center;
    background:linear-gradient(135deg,var(--wood-dark),#3a2518);
  }
  .photo-label h2{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:clamp(0.9rem,3vw,1.1rem);font-weight:600;
    color:var(--cream);letter-spacing:0.06em;
  }
  .photo-label p{font-size:0.65rem;color:rgba(255,247,238,0.5);margin-top:0.15rem}
  .photo-badge{
    position:absolute;top:8px;right:8px;z-index:2;
    padding:0.25rem 0.6rem;border-radius:999px;
    background:rgba(26,15,8,0.7);backdrop-filter:blur(8px);
    font-size:0.6rem;color:var(--gold);letter-spacing:0.1em;
    border:1px solid rgba(232,193,126,0.3);
  }

  /* minimize photo */
  .arena.show-game .photo-frame{
    width:min(70vw,280px);top:8px;
  }
  .arena.show-game .photo-frame img{aspect-ratio:16/7}

  /* ===== SKY ===== */
  .sun{
    position:absolute;top:5%;right:8%;
    width:clamp(35px,8vw,60px);height:clamp(35px,8vw,60px);border-radius:50%;
    background:radial-gradient(circle,#fff7aa 30%,#ffd700 70%,transparent 100%);
    box-shadow:0 0 40px 10px rgba(255,215,0,0.3);
    animation:sunPulse 4s ease-in-out infinite;z-index:1;
  }
  @keyframes sunPulse{0%,100%{box-shadow:0 0 40px 10px rgba(255,215,0,0.3)}50%{box-shadow:0 0 60px 18px rgba(255,215,0,0.4)}}

  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:0.8;filter:blur(1px);z-index:1}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud.c1{width:80px;height:28px;top:8%;left:-100px;animation:cloudDrift 20s linear infinite}
  .cloud.c1::before{width:40px;height:34px;top:-14px;left:12px}
  .cloud.c1::after{width:52px;height:30px;top:-10px;left:34px}
  .cloud.c2{width:60px;height:22px;top:14%;left:-80px;animation:cloudDrift 28s linear infinite 6s;opacity:0.6}
  .cloud.c2::before{width:32px;height:28px;top:-12px;left:10px}
  .cloud.c2::after{width:42px;height:24px;top:-8px;left:28px}
  @keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 120px))}}

  /* ===== GROUND ===== */
  .ground{
    position:absolute;bottom:0;left:0;right:0;height:32%;
    background:linear-gradient(180deg,var(--green) 0%,var(--green-dark) 12%,var(--dirt) 40%,#4a2f1a 100%);
    border-radius:50% 50% 0 0 / 6% 6% 0 0;
    z-index:2;
  }
  .ground::before{
    content:"";position:absolute;top:-2px;left:0;right:0;height:16px;
    background:linear-gradient(180deg,var(--green),transparent);
    border-radius:50% 50% 0 0;
  }
  .grass{position:absolute;bottom:31%;width:100%;height:12px;z-index:2}
  .grass span{
    position:absolute;bottom:0;width:3px;background:var(--green-dark);
    border-radius:2px 2px 0 0;animation:grassWave 2s ease-in-out infinite;
  }
  @keyframes grassWave{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

  /* ===== CHICKEN COOP ===== */
  .coop{
    position:absolute;bottom:22%;left:50%;transform:translateX(-50%);
    width:min(80vw,380px);height:clamp(100px,22vw,160px);z-index:3;
  }
  .coop-roof{
    position:absolute;top:0;left:-10px;right:-10px;height:40px;
    background:linear-gradient(135deg,var(--wood-dark),var(--wood),var(--wood-light));
    clip-path:polygon(10% 100%,0% 0%,100% 0%,90% 100%);
    box-shadow:0 3px 8px rgba(0,0,0,0.3);
  }
  .coop-roof::after{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#3a2518,#5c3d2e,#3a2518)}
  .coop-body{
    position:absolute;top:38px;left:0;right:0;bottom:0;
    background:rgba(139,94,60,0.15);border:2.5px solid var(--wood);border-radius:3px;overflow:hidden;
  }
  .coop-body::before{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(90deg,transparent,transparent 14px,rgba(100,60,30,0.2) 14px,rgba(100,60,30,0.2) 16px),
      repeating-linear-gradient(0deg,transparent,transparent 14px,rgba(100,60,30,0.2) 14px,rgba(100,60,30,0.2) 16px);
  }
  .coop-door{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:clamp(45px,10vw,60px);height:clamp(55px,13vw,72px);
    background:var(--wood-dark);border:2.5px solid var(--wood);border-bottom:none;border-radius:25px 25px 0 0;
  }
  .coop-door::after{content:"";position:absolute;top:50%;right:6px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 4px rgba(232,193,126,0.5)}
  .nest{position:absolute;bottom:5px;width:36px;height:28px;background:var(--wood-dark);border:2px solid var(--wood);border-radius:3px 3px 0 0}
  .nest::before{content:"";position:absolute;bottom:2px;left:2px;right:2px;height:8px;background:#d4a574;border-radius:50%}
  .nest.n1{left:6px}.nest.n2{left:50px}.nest.n3{right:6px}
  .egg{position:absolute;bottom:10px;width:10px;height:13px;background:radial-gradient(ellipse at 40% 30%,#fff,#f5e6d0);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%}
  .egg.e1{left:14px}.egg.e2{left:22px;bottom:8px}.egg.e3{right:14px}

  /* ===== SIGN ===== */
  .sign{
    position:absolute;bottom:28%;right:4%;
    width:clamp(80px,18vw,120px);cursor:pointer;z-index:8;
    transition:transform 0.3s var(--spring);
  }
  .sign:hover,.sign:active{transform:rotate(-3deg) scale(1.05)}
  .sign-post{position:absolute;bottom:-45px;left:50%;transform:translateX(-50%);width:8px;height:48px;background:var(--wood-dark);border-radius:2px}
  .sign-board{
    background:linear-gradient(135deg,var(--wood),var(--wood-light));
    border:2px solid var(--wood-dark);border-radius:4px;padding:5px;text-align:center;
    box-shadow:2px 3px 6px rgba(0,0,0,0.3);
  }
  .sign-board h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(0.4rem,1.3vw,0.6rem);font-weight:600;color:var(--cream);line-height:1.25}
  .sign-board .ci{font-size:clamp(0.55rem,1.8vw,0.8rem)}

  /* ===== CHIKOY ===== */
  .chikoy{
    position:absolute;bottom:22%;left:8%;
    width:clamp(50px,13vw,70px);cursor:pointer;z-index:10;
    transition:transform 0.3s var(--spring);
  }
  .chikoy:hover,.chikoy:active{transform:scale(1.08)}
  .chikoy.bounce{animation:chBounce 0.5s var(--spring)}
  @keyframes chBounce{0%{transform:translateY(0)}40%{transform:translateY(-14px)}100%{transform:translateY(0)}}

  .chikoy-head{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:clamp(32px,8vw,44px);height:clamp(32px,8vw,44px);border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#ffe0b2,#ffcc80);
    box-shadow:0 3px 5px rgba(0,0,0,0.2);z-index:2;
  }
  .chikoy-hair{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:clamp(24px,6vw,34px);height:14px;background:#2a1a0a;border-radius:50% 50% 0 0;z-index:3}
  .chikoy-hair::before{content:"";position:absolute;top:-3px;left:5px;width:9px;height:10px;background:#2a1a0a;border-radius:50% 50% 0 0;transform:rotate(-15deg)}
  .chikoy-eyes{position:absolute;top:35%;left:50%;transform:translateX(-50%);display:flex;gap:clamp(7px,2vw,11px);z-index:4}
  .chikoy-eye{width:5px;height:5px;border-radius:50%;background:#1a0a00;animation:chBlink 4s ease-in-out infinite}
  .chikoy-eye::after{content:"";position:absolute;top:1px;left:1px;width:2px;height:2px;border-radius:50%;background:#fff}
  @keyframes chBlink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(0.1)}}
  .chikoy-mouth{position:absolute;top:55%;left:50%;transform:translateX(-50%);width:9px;height:5px;border-radius:0 0 7px 7px;background:#e57373;z-index:4}
  .chikoy-cheek{position:absolute;top:42%;width:7px;height:4px;background:rgba(255,138,128,0.5);border-radius:50%;z-index:4}
  .chikoy-cheek.l{left:2px}.chikoy-cheek.r{right:2px}
  .chikoy-body{
    position:absolute;top:clamp(28px,7vw,38px);left:50%;transform:translateX(-50%);
    width:clamp(30px,7vw,40px);height:clamp(28px,7vw,36px);
    background:linear-gradient(180deg,#FFD700,#FFC107);
    border-radius:5px 5px 3px 3px;box-shadow:0 3px 5px rgba(0,0,0,0.15);z-index:1;
  }
  .chikoy-body::before{content:"CHOOSE FEAR";position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:clamp(0.18rem,0.7vw,0.3rem);font-weight:700;color:#1a0a00;white-space:nowrap;border:1px solid #1a0a00;padding:1px 2px}
  .chikoy-arm{position:absolute;top:clamp(32px,8vw,44px);width:14px;height:5px;background:#FFD700;border-radius:3px;z-index:0;transition:transform 0.3s var(--spring)}
  .chikoy-arm.l{left:1px;transform:rotate(20deg);transform-origin:right center}
  .chikoy-arm.r{right:1px;transform:rotate(-20deg);transform-origin:left center}
  .chikoy.feeding .chikoy-arm.r{animation:feedArm 0.6s ease-in-out 3}
  @keyframes feedArm{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-50deg)}}
  .chikoy-leg{position:absolute;bottom:-12px;width:9px;height:14px;background:#37474F;border-radius:2px 2px 3px 3px;z-index:0}
  .chikoy-leg.l{left:12px}.chikoy-leg.r{right:12px}

  /* ===== FEED BUCKET ===== */
  .bucket{
    position:absolute;bottom:23%;left:32%;
    width:clamp(32px,8vw,44px);cursor:pointer;z-index:8;
    transition:transform 0.2s var(--spring);
  }
  .bucket:hover,.bucket:active{transform:scale(1.1)}
  .bucket.shake{animation:bShake 0.4s ease-in-out}
  @keyframes bShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  .bucket-body{position:absolute;bottom:0;left:3px;right:3px;height:26px;background:linear-gradient(135deg,var(--wood),var(--wood-light));border-radius:0 0 4px 4px;border:2px solid var(--wood-dark)}
  .bucket-rim{position:absolute;top:0;left:0;right:0;height:7px;background:var(--wood-dark);border-radius:3px}
  .bucket-handle{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:22px;height:12px;border:2px solid var(--wood-dark);border-bottom:none;border-radius:10px 10px 0 0}
  .bucket-feed{position:absolute;top:5px;left:5px;right:5px;height:12px;background:radial-gradient(ellipse,#f5deb3,#daa520);border-radius:2px}
  .bucket-label{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:0.3rem;color:var(--cream);font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,0.3);white-space:nowrap}

  /* ===== FEED PARTICLES ===== */
  .feed-particle{
    position:absolute;width:5px;height:5px;
    background:radial-gradient(circle,#f5deb3,#daa520);
    border-radius:50%;pointer-events:none;z-index:5;
    animation:feedFall 0.8s ease-in forwards;
  }
  @keyframes feedFall{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(0.4)}}

  /* ===== CHICKENS ===== */
  .chicken{position:absolute;cursor:pointer;transition:transform 0.3s var(--spring);z-index:6}
  .chicken:hover,.chicken:active{transform:scale(1.1)}
  .chicken.peck{animation:chPeck 0.4s ease-in-out 3}
  @keyframes chPeck{0%,100%{transform:rotate(0)}50%{transform:rotate(15deg) translateY(3px)}}
  .chicken.happy{animation:chHappy 0.5s var(--spring)}
  @keyframes chHappy{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}

  .ch-body{position:relative;width:clamp(32px,8vw,44px);height:clamp(26px,6vw,34px);border-radius:50% 50% 45% 45%}
  .ch-head{position:absolute;top:-9px;left:18px;width:clamp(14px,3.5vw,19px);height:clamp(14px,3.5vw,19px);border-radius:50%;z-index:2}
  .ch-eye{position:absolute;top:5px;left:10px;width:3px;height:3px;border-radius:50%;background:#1a0a00;z-index:3}
  .ch-eye::after{content:"";position:absolute;top:0.5px;left:1px;width:1px;height:1px;border-radius:50%;background:#fff}
  .ch-beak{position:absolute;top:7px;left:12px;width:5px;height:3px;background:#ff8f00;border-radius:0 4px 4px 0;z-index:3}
  .ch-wattle{position:absolute;top:10px;left:11px;width:3px;height:4px;background:#e53935;border-radius:50%;z-index:2}
  .ch-comb{position:absolute;top:-11px;left:16px;width:9px;height:7px;background:#e53935;border-radius:50% 50% 0 0;z-index:3}
  .ch-comb::before{content:"";position:absolute;top:-3px;left:3px;width:5px;height:5px;background:#e53935;border-radius:50% 50% 0 0}
  .ch-tail{position:absolute;top:1px;left:-5px;width:10px;height:14px;border-radius:50% 0 0 50%;transform:rotate(10deg)}
  .ch-wing{position:absolute;top:7px;left:3px;width:12px;height:10px;border-radius:50% 0 0 50%;opacity:0.8}
  .ch-legs{position:absolute;bottom:-5px;left:10px;display:flex;gap:7px}
  .ch-leg{width:2px;height:7px;background:#ff8f00;border-radius:0 0 2px 2px}

  .chicken.brown .ch-body{background:linear-gradient(135deg,#8B4513,#A0522D,#8B4513)}
  .chicken.brown .ch-head{background:linear-gradient(135deg,#A0522D,#8B4513)}
  .chicken.brown .ch-tail{background:#6B3410}.chicken.brown .ch-wing{background:#7A4420}
  .chicken.white .ch-body{background:linear-gradient(135deg,#f5f5f5,#e0e0e0,#f5f5f5)}
  .chicken.white .ch-head{background:#f0f0f0}
  .chicken.white .ch-tail{background:#ddd}.chicken.white .ch-wing{background:#e8e8e8}
  .chicken.black .ch-body{background:linear-gradient(135deg,#2a2a2a,#1a1a1a,#2a2a2a)}
  .chicken.black .ch-head{background:#222}
  .chicken.black .ch-tail{background:#111}.chicken.black .ch-wing{background:#1a1a1a}
  .chicken.walk{animation:chWalk 2s ease-in-out infinite}
  @keyframes chWalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

  /* ===== LOVE BURST ===== */
  .love-burst{position:absolute;pointer-events:none;z-index:20;font-size:0.9rem;animation:loveFloat 0.8s ease-out forwards}
  @keyframes loveFloat{0%{opacity:1;transform:translate(0,0) scale(0.5)}100%{opacity:0;transform:translate(var(--lx),var(--ly)) scale(1.1)}}

  /* ===== TOP CONTROLS ===== */
  .top-controls{
    position:absolute;top:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:0.6rem 1rem;
    background:linear-gradient(180deg,rgba(26,15,8,0.8),transparent);
  }
  .top-controls .back{
    color:var(--cream);text-decoration:none;font-size:0.7rem;
    padding:0.3rem 0.6rem;border-radius:999px;
    border:1px solid rgba(255,143,171,0.3);
    background:rgba(26,15,8,0.5);backdrop-filter:blur(8px);
  }
  .top-controls .title{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:0.85rem;font-weight:600;color:var(--gold);
    background:rgba(26,15,8,0.5);backdrop-filter:blur(8px);
    padding:0.3rem 0.8rem;border-radius:999px;
    border:1px solid rgba(232,193,126,0.2);
  }

  /* ===== BOTTOM CONTROLS ===== */
  .bottom-controls{
    position:absolute;bottom:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;justify-content:space-around;
    padding:0.5rem 0.8rem;
    background:linear-gradient(0deg,rgba(26,15,8,0.85),transparent);
  }
  .ctrl-item{display:flex;align-items:center;gap:0.25rem;font-size:0.7rem}
  .ctrl-val{color:var(--gold);font-weight:600}
  .feed-btn{
    padding:0.45rem 1.2rem;border-radius:999px;border:none;
    background:linear-gradient(135deg,var(--rose),#e0567c);
    color:#fff;font-family:inherit;font-size:0.72rem;font-weight:600;
    cursor:pointer;letter-spacing:0.04em;
    box-shadow:0 4px 12px rgba(224,86,124,0.4);
    transition:all 0.2s ease;
  }
  .feed-btn:hover,.feed-btn:active{transform:scale(1.06);box-shadow:0 6px 16px rgba(224,86,124,0.5)}

  /* ===== TOAST ===== */
  .toast{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    padding:0.5rem 1rem;border-radius:10px;
    background:rgba(26,15,8,0.92);border:1px solid rgba(232,193,126,0.3);
    backdrop-filter:blur(12px);font-size:0.78rem;color:var(--cream);
    z-index:200;white-space:nowrap;pointer-events:none;
    animation:toastPop 0.3s var(--spring);
  }
  @keyframes toastPop{from{opacity:0;transform:translate(-50%,-50%) scale(0.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

  /* ===== HINT ===== */
  .hint{
    position:absolute;bottom:3.5rem;left:50%;transform:translateX(-50%);
    padding:0.4rem 0.9rem;border-radius:999px;
    background:rgba(26,15,8,0.8);backdrop-filter:blur(8px);
    font-size:0.68rem;color:rgba(255,247,238,0.6);z-index:40;
    animation:hintFade 3.5s ease forwards;white-space:nowrap;
  }
  @keyframes hintFade{0%,70%{opacity:0.8}100%{opacity:0}}

  @media(prefers-reduced-motion:reduce){
    *,*::before,::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
  }
</style>
</head>
<body>

<div class="arena" id="arena">
  <!-- sky -->
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <!-- top controls -->
  <div class="top-controls">
    <a class="back" href="lovepage.html">&#8592;</a>
    <span class="title">CHIKOY'S CHICKEN HOUSE</span>
  </div>

  <!-- PHOTO INSIDE ARENA -->
  <div class="photo-frame" id="photoFrame">
    <span class="photo-badge">CHIKOY'S FARM</span>
    <img src="chickenhouse-photos/chikoy-chickens.png" alt="Chikoy at the Chicken House">
    <div class="photo-label">
      <h2>Welcome to My Chicken House</h2>
      <p>tap to minimize</p>
    </div>
  </div>

  <!-- coop -->
  <div class="coop">
    <div class="coop-roof"></div>
    <div class="coop-body">
      <div class="coop-door"></div>
      <div class="nest n1"></div>
      <div class="nest n2"></div>
      <div class="nest n3"></div>
      <div class="egg e1"></div>
      <div class="egg e2"></div>
      <div class="egg e3"></div>
    </div>
  </div>

  <!-- sign -->
  <div class="sign" id="sign">
    <div class="sign-board">
      <div class="ci">🐔</div>
      <h3>WELCOME TO<br>MY CHICKEN<br>HOUSE</h3>
      <div class="ci">🐔</div>
    </div>
    <div class="sign-post"></div>
  </div>

  <!-- chikoy -->
  <div class="chikoy" id="chikoy">
    <div class="chikoy-hair"></div>
    <div class="chikoy-head">
      <div class="chikoy-eyes"><div class="chikoy-eye"></div><div class="chikoy-eye"></div></div>
      <div class="chikoy-mouth"></div>
      <div class="chikoy-cheek l"></div><div class="chikoy-cheek r"></div>
    </div>
    <div class="chikoy-body"></div>
    <div class="chikoy-arm l"></div><div class="chikoy-arm r"></div>
    <div class="chikoy-leg l"></div><div class="chikoy-leg r"></div>
  </div>

  <!-- bucket -->
  <div class="bucket" id="bucket">
    <div class="bucket-handle"></div>
    <div class="bucket-rim"></div>
    <div class="bucket-body">
      <div class="bucket-feed"></div>
      <div class="bucket-label">FEED</div>
    </div>
  </div>

  <div class="grass" id="grass"></div>
  <div class="ground"></div>

  <!-- bottom controls -->
  <div class="bottom-controls">
    <div class="ctrl-item">🌾 <span class="ctrl-val" id="feedCount">0</span></div>
    <button class="feed-btn" id="feedBtn">FEED ALL!</button>
    <div class="ctrl-item">🐔 <span class="ctrl-val" id="chickenCount">0</span></div>
    <div class="ctrl-item">❤️ <span class="ctrl-val" id="loveCount">0</span></div>
  </div>
</div>

<script>
  var arena = document.getElementById('arena');
  var chikoy = document.getElementById('chikoy');
  var bucket = document.getElementById('bucket');
  var photoFrame = document.getElementById('photoFrame');
  var feedCount = 0, loveCount = 0;
  var chickens = [];
  var photoMinimized = false;

  /* minimize photo on tap */
  photoFrame.addEventListener('click', function(){
    photoMinimized = !photoMinimized;
    arena.classList.toggle('show-game', photoMinimized);
    photoFrame.querySelector('p').textContent = photoMinimized ? 'tap to expand' : 'tap to minimize';
  });

  /* grass */
  (function(){
    var g = document.getElementById('grass');
    for(var i=0;i<35;i++){
      var s = document.createElement('span');
      s.style.left = (i/35*100)+'%';
      s.style.height = (5+Math.random()*8)+'px';
      s.style.animationDelay = (Math.random()*2)+'s';
      g.appendChild(s);
    }
  })();

  /* chickens */
  var chickenData = [
    {type:'brown',x:55,y:62,name:'Tikyo'},
    {type:'brown',x:65,y:65,name:'Browny'},
    {type:'white',x:72,y:60,name:'Snow'},
    {type:'brown',x:48,y:68,name:'Clucky'},
    {type:'black',x:80,y:64,name:'Midnight'},
    {type:'white',x:38,y:66,name:'Cotton'},
    {type:'brown',x:60,y:70,name:'Sunny'},
    {type:'black',x:45,y:63,name:'Shadow'},
  ];

  function createChicken(data, idx){
    var el = document.createElement('div');
    el.className = 'chicken ' + data.type + ' walk';
    el.style.left = data.x + '%';
    el.style.bottom = (100 - data.y) + '%';
    el.style.animationDelay = (idx * 0.3) + 's';
    el.innerHTML =
      '<div class="ch-tail"></div>' +
      '<div class="ch-body">' +
        '<div class="ch-wing"></div>' +
        '<div class="ch-comb"></div>' +
        '<div class="ch-head">' +
          '<div class="ch-eye"></div>' +
          '<div class="ch-beak"></div>' +
          '<div class="ch-wattle"></div>' +
        '</div>' +
      '</div>' +
      '<div class="ch-legs"><div class="ch-leg"></div><div class="ch-leg"></div></div>';
    el.addEventListener('click', function(e){ e.stopPropagation(); petChicken(el, data); });
    arena.appendChild(el);
    chickens.push({el:el, data:data});
    setInterval(function(){
      if(Math.random() > 0.6){
        var dx = (Math.random()-0.5)*20;
        data.x = Math.max(15, Math.min(85, data.x + dx));
        el.style.left = data.x + '%';
        el.style.transform = dx > 0 ? 'scaleX(1)' : 'scaleX(-1)';
      }
    }, 3000 + idx*500);
  }
  chickenData.forEach(function(c,i){ createChicken(c,i); });
  document.getElementById('chickenCount').textContent = chickens.length;

  /* feed */
  function feedChickens(){
    chikoy.classList.add('feeding');
    setTimeout(function(){ chikoy.classList.remove('feeding'); }, 1800);
    bucket.classList.add('shake');
    setTimeout(function(){ bucket.classList.remove('shake'); }, 400);

    var rect = bucket.getBoundingClientRect();
    var aRect = arena.getBoundingClientRect();
    var sx = rect.left - aRect.left + rect.width/2;
    var sy = rect.top - aRect.top;
    for(var i=0;i<10;i++){
      var p = document.createElement('div');
      p.className = 'feed-particle';
      p.style.left = sx + 'px'; p.style.top = sy + 'px';
      p.style.setProperty('--fx', ((Math.random()-0.5)*70)+'px');
      p.style.setProperty('--fy', (Math.random()*40+12)+'px');
      arena.appendChild(p);
      setTimeout(function(pp){ pp.remove(); }.bind(null,p), 800);
    }
    feedCount += chickens.length;
    document.getElementById('feedCount').textContent = feedCount;
    chickens.forEach(function(c, i){
      setTimeout(function(){
        c.el.classList.add('peck');
        setTimeout(function(){ c.el.classList.remove('peck'); }, 1200);
      }, i * 100);
    });
  }

  bucket.addEventListener('click', function(e){ e.stopPropagation(); feedChickens(); });
  document.getElementById('feedBtn').addEventListener('click', feedChickens);

  /* pet */
  function petChicken(el, data){
    el.classList.add('happy');
    setTimeout(function(){ el.classList.remove('happy'); }, 500);
    loveCount++;
    document.getElementById('loveCount').textContent = loveCount;
    for(var i=0;i<2;i++){
      var heart = document.createElement('div');
      heart.className = 'love-burst';
      heart.textContent = ['❤️','💕','💗'][Math.floor(Math.random()*3)];
      var r = el.getBoundingClientRect(); var ar = arena.getBoundingClientRect();
      heart.style.left = (r.left - ar.left + r.width/2 + (Math.random()-0.5)*20) + 'px';
      heart.style.top = (r.top - ar.top - 6) + 'px';
      heart.style.setProperty('--lx', ((Math.random()-0.5)*40)+'px');
      heart.style.setProperty('--ly', (-30 - Math.random()*25)+'px');
      arena.appendChild(heart);
      setTimeout(function(h){ h.remove(); }.bind(null,heart), 800);
    }
  }

  /* chikoy */
  chikoy.addEventListener('click', function(){
    chikoy.classList.add('bounce');
    setTimeout(function(){ chikoy.classList.remove('bounce'); }, 500);
    var heart = document.createElement('div');
    heart.className = 'love-burst'; heart.textContent = '💛';
    var r = chikoy.getBoundingClientRect(); var ar = arena.getBoundingClientRect();
    heart.style.left = (r.left - ar.left + r.width/2) + 'px';
    heart.style.top = (r.top - ar.top) + 'px';
    heart.style.setProperty('--lx', '0px'); heart.style.setProperty('--ly', '-35px');
    arena.appendChild(heart);
    setTimeout(function(){ heart.remove(); }, 800);
  });

  /* sign */
  document.getElementById('sign').addEventListener('click', function(){
    var msgs = ["Welcome to Chikoy's domain!","The chickens love you!","Bawk bawk bawk!","Fresh eggs daily!","Chikoy is the chicken king!","Peck peck peck!"];
    var t = document.createElement('div'); t.className = 'toast';
    t.textContent = msgs[Math.floor(Math.random()*msgs.length)];
    arena.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2000);
  });

  /* keyboard */
  document.addEventListener('keydown', function(e){
    if(e.key === 'f' || e.key === 'F') feedChickens();
  });

  /* hint */
  setTimeout(function(){
    var h = document.createElement('div'); h.className = 'hint';
    h.textContent = 'Tap bucket or press F to feed!';
    arena.appendChild(h);
    setTimeout(function(){ h.remove(); }, 4000);
  }, 600);

  window.scrollTo(0,0);
</script>
<script src="app.js"></script>
</body>
</html>
