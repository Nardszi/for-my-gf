<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d0812"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rezil's Animal Farm</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animalfarm.css">
</head>
<body>
<div class="scene" id="scene">
  <div class="stars" id="stars"></div>
  <div class="sun" id="sun"></div>
  <div class="moon" id="moon"></div>
  <div class="cloud a"></div><div class="cloud b"></div>
  <div class="butterfly" style="top:18%;left:12%;animation-delay:0s">&#x1F98B;</div>
  <div class="butterfly" style="top:22%;left:55%;animation-delay:2.5s">&#x1F98B;</div>
  <div class="butterfly" style="top:14%;left:78%;animation-delay:4.5s">&#x1F98B;</div>
  <div class="flower" style="bottom:30%;left:10%">&#x1F338;</div>
  <div class="flower" style="bottom:28%;left:30%">&#x1F33C;</div>
  <div class="flower" style="bottom:29%;left:55%">&#x1F338;</div>
  <div class="flower" style="bottom:27%;left:82%">&#x1F33C;</div>
  <div class="flower" style="bottom:31%;left:42%">&#x1F338;</div>
  <div class="flower" style="bottom:26%;left:68%">&#x1F33C;</div>

  <!-- Barn -->
  <div class="barn-3d">
    <div class="barn">
      <div class="barn-roof"><div class="barn-roof-top"></div><div class="barn-roof-side"></div></div>
      <div class="barn-main">
        <div class="barn-door-l"></div><div class="barn-door-r"></div>
        <div class="barn-window"></div>
      </div>
    </div>
  </div>

  <!-- Sign -->
  <div class="sign-3d" id="signBtn">
    <div class="sign-box">
      <div class="sign-front"><h3>Rezil's<br>Animal Farm</h3><div class="ci">&#x1F3E1;</div></div>
      <div class="sign-edge"></div>
    </div>
    <div class="sign-post"></div>
  </div>

  <!-- Animal Pens -->
  <div class="animal-pen" id="cowPen" style="bottom:22%;left:2%">
    <div class="pen-label">&#x1F404; Cow</div>
    <div class="pen-fence"></div>
    <div class="farm-animal cow" id="cow">
      <div class="cow-body"><div class="cow-spot s1"></div><div class="cow-spot s2"></div><div class="cow-spot s3"></div></div>
      <div class="cow-head"><div class="cow-ear l"></div><div class="cow-ear r"></div><div class="cow-horn l"></div><div class="cow-horn r"></div><div class="cow-eye l"></div><div class="cow-eye r"></div><div class="cow-nose"></div></div>
      <div class="cow-tail"></div>
      <div class="cow-leg l f"></div><div class="cow-leg r f"></div><div class="cow-leg l b"></div><div class="cow-leg r b"></div>
      <div class="animal-name"></div>
    </div>
  </div>

  <div class="animal-pen" id="capybaraPen" style="bottom:20%;right:3%">
    <div class="pen-label">&#x1F43F; Capybara</div>
    <div class="pen-fence"></div>
    <div class="farm-animal capybara" id="capybara">
      <div class="capy-body"></div>
      <div class="capy-head"><div class="capy-eye l"></div><div class="capy-eye r"></div><div class="capy-nose"></div><div class="capy-ear l"></div><div class="capy-ear r"></div></div>
      <div class="capy-leg l f"></div><div class="capy-leg r f"></div><div class="capy-leg l b"></div><div class="capy-leg r b"></div>
      <div class="capy-orange"></div>
      <div class="animal-name"></div>
    </div>
  </div>

  <div class="animal-pen" id="rabbitPen" style="bottom:28%;left:28%">
    <div class="pen-label">&#x1F407; Rabbit</div>
    <div class="pen-fence"></div>
    <div class="farm-animal rabbit" id="rabbit">
      <div class="rab-body"></div>
      <div class="rab-head"><div class="rab-ear l"></div><div class="rab-ear r"></div><div class="rab-eye l"></div><div class="rab-eye r"></div><div class="rab-nose"></div><div class="rab-cheek l"></div><div class="rab-cheek r"></div></div>
      <div class="rab-tail"></div>
      <div class="rab-leg l"></div><div class="rab-leg r"></div>
      <div class="animal-name"></div>
    </div>
  </div>

  <div class="animal-pen" id="pigPen" style="bottom:18%;right:28%">
    <div class="pen-label">&#x1F437; Pig</div>
    <div class="pen-fence"></div>
    <div class="farm-animal pig" id="pig">
      <div class="pig-body"></div>
      <div class="pig-head"><div class="pig-ear l"></div><div class="pig-ear r"></div><div class="pig-eye l"></div><div class="pig-eye r"></div><div class="pig-snout"><div class="pig-nostril l"></div><div class="pig-nostril r"></div></div></div>
      <div class="pig-curl"></div>
      <div class="pig-leg l f"></div><div class="pig-leg r f"></div><div class="pig-leg l b"></div><div class="pig-leg r b"></div>
      <div class="animal-name"></div>
    </div>
  </div>

  <div class="animal-pen" id="goatPen" style="bottom:26%;right:18%">
    <div class="pen-label">&#x1F410; Goat</div>
    <div class="pen-fence"></div>
    <div class="farm-animal goat" id="goat">
      <div class="goat-body"></div>
      <div class="goat-head"><div class="goat-horn l"></div><div class="goat-horn r"></div><div class="goat-ear l"></div><div class="goat-ear r"></div><div class="goat-eye l"></div><div class="goat-eye r"></div><div class="goat-beard"></div></div>
      <div class="goat-leg l f"></div><div class="goat-leg r f"></div><div class="goat-leg l b"></div><div class="goat-leg r b"></div>
      <div class="animal-name"></div>
    </div>
  </div>

  <div class="animal-pen" id="duckPen" style="bottom:24%;left:12%">
    <div class="pen-label">&#x1F986; Duck</div>
    <div class="pen-fence"></div>
    <div class="farm-animal duck" id="duck">
      <div class="duck-body"></div>
      <div class="duck-head"><div class="duck-eye l"></div><div class="duck-eye r"></div><div class="duck-bill"></div></div>
      <div class="duck-wing"></div>
      <div class="duck-leg l"></div><div class="duck-leg r"></div>
      <div class="animal-name"></div>
    </div>
  </div>

  <div class="animal-pen" id="sheepPen" style="bottom:30%;left:48%">
    <div class="pen-label">&#x1F411; Sheep</div>
    <div class="pen-fence"></div>
    <div class="farm-animal sheep" id="sheep">
      <div class="sheep-wool"></div>
      <div class="sheep-head"><div class="sheep-ear l"></div><div class="sheep-ear r"></div><div class="sheep-eye l"></div><div class="sheep-eye r"></div></div>
      <div class="sheep-leg l f"></div><div class="sheep-leg r f"></div><div class="sheep-leg l b"></div><div class="sheep-leg r b"></div>
      <div class="animal-name"></div>
    </div>
  </div>

  <div class="animal-pen" id="catPen" style="bottom:16%;left:42%">
    <div class="pen-label">&#x1F431; Cat</div>
    <div class="pen-fence"></div>
    <div class="farm-animal cat" id="cat">
      <div class="cat-body"></div>
      <div class="cat-head"><div class="cat-ear l"></div><div class="cat-ear r"></div><div class="cat-eye l"></div><div class="cat-eye r"></div><div class="cat-nose"></div><div class="cat-whisker l1"></div><div class="cat-whisker l2"></div><div class="cat-whisker r1"></div><div class="cat-whisker r2"></div></div>
      <div class="cat-tail"></div>
      <div class="cat-leg l f"></div><div class="cat-leg r f"></div><div class="cat-leg l b"></div><div class="cat-leg r b"></div>
      <div class="animal-name"></div>
    </div>
  </div>

  <!-- Feeding trough -->
  <div class="trough-3d" id="trough">
    <div class="trough"><div class="trough-body"><div class="trough-feed"></div></div><div class="trough-leg l"></div><div class="trough-leg r"></div></div>
  </div>

  <div class="ground"></div>

  <!-- UI -->
  <div class="top-ui">
    <a href="lovepage.html" class="bk">&#x2190; Back</a>
    <div class="tt">&#x1F3E1; Rezil's Animal Farm</div>
  </div>
  <button class="day-toggle" id="dayToggle" aria-label="Toggle day/night">&#x2600;&#xFE0F;</button>
  <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">&#x1F50A;</button>
  <div class="feed-counter">&#x1F33E; Fed <span class="fc-v" id="feedC">0</span> times</div>
  <div class="bot-ui">
    <div class="ct" aria-label="Animals befriended">&#x1F31F; <span class="v" id="friendC">0</span>/8</div>
    <button class="fbtn" id="feedBtn" aria-label="Feed all animals">&#x1F33E; Feed All</button>
    <div class="ct" aria-label="Love notes found">&#x1F48C; <span class="v" id="noteC">0</span></div>
  </div>
  <div class="hint" id="hint"></div>
</div>
<script src="app.js"></script>
<script src="animalfarm.js"></script>
</body>
</html>
